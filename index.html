<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Война Кольца — справочник игрока</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#E3E5DF;--surface:#F3F4F0;--surface2:#EAECE6;--ink:#1D2329;--muted:#5A626A;--line:#C5CAC1;
 --fp:#2C5D88;--fp-soft:#DCE6EF;--sh:#982D23;--sh-soft:#F1DEDA;--gold:#866719;--gold-soft:#EFE6CC;
 --focus:#2C5D88;
 --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
 --sans:'Alegreya Sans','Segoe UI',Roboto,Arial,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#141A20;--surface:#1C232B;--surface2:#222B34;--ink:#E4E2DB;--muted:#9AA2AA;--line:#313C47;
 --fp:#86B4DE;--fp-soft:#1F3347;--sh:#E58A7B;--sh-soft:#3F2522;--gold:#D6B868;--gold-soft:#3A3220;--focus:#86B4DE;}}
:root[data-theme="dark"]{
 --bg:#141A20;--surface:#1C232B;--surface2:#222B34;--ink:#E4E2DB;--muted:#9AA2AA;--line:#313C47;
 --fp:#86B4DE;--fp-soft:#1F3347;--sh:#E58A7B;--sh-soft:#3F2522;--gold:#D6B868;--gold-soft:#3A3220;--focus:#86B4DE;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);min-height:100%}
a{color:var(--gold);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
a.cl-fp{color:var(--fp)} a.cl-sh{color:var(--sh)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-family:var(--sans);font-size:13px;font-weight:400;color:var(--muted);letter-spacing:0}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.sres{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:60vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
.sres.on{display:block}
.sres a{display:block;padding:7px 12px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line)}
.sres a.sel,.sres a:hover{background:var(--surface2)}
.sres .k{font-size:13px;color:var(--muted)}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px}
nav.tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
nav.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs a.on{color:var(--ink);border-bottom-color:var(--gold)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.cols{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
@media (max-width:820px){.cols{grid-template-columns:1fr}.idx{max-height:none}}
.idx{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto;font-size:15px}
.idx h3{font-size:17px;margin:14px 0 4px;color:var(--muted)}
.idx a{display:block;padding:3px 8px;text-decoration:none;color:var(--ink);border-left:2px solid transparent}
.idx a.on{border-left-color:var(--gold);background:var(--surface2)}
@media (max-width:820px){.idx{position:static}.idx details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface)}}
article.ent{max-width:72ch}
article.ent h1{font-size:44px;margin-bottom:6px}
article.ent .grp{color:var(--muted);font-size:15px;margin-bottom:18px}
article.ent li{margin:5px 0}
.back{color:var(--muted);font-size:15px;margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;padding:2px 9px;border:1px solid var(--line);border-radius:999px;font-size:14px;text-decoration:none;color:var(--ink);background:var(--surface)}
/* cards */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.filters input[type=search]{padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--fp);border-radius:4px;padding:10px 12px 10px 12px;text-decoration:none;color:var(--ink);display:block}
.tile.sh{border-left-color:var(--sh)}
.tile .nm{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1;padding-right:26px}
.tile .meta{font-size:13px;color:var(--muted);margin-top:3px}
.tile .cb{font-size:14px;margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.tile .cmp{position:absolute;top:8px;right:8px;width:20px;height:20px}
.tile.used{opacity:.5}
.ini{display:inline-flex;min-width:24px;height:24px;padding:0 5px;border-radius:12px;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:30}
.tray.on{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tray button{background:var(--bg);color:var(--ink);border:0;border-radius:5px;padding:6px 12px}
.card-d{max-width:900px}
.card-d .hd{border-left:6px solid var(--fp);padding:4px 0 4px 16px;margin-bottom:16px}
.card-d.sh .hd{border-left-color:var(--sh)}
.card-d h1{font-size:42px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:12px 0}
.blk h2{font-size:24px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.cond{font-weight:700}
.lbl{color:var(--muted);font-size:14px}
.cmpt{border-collapse:collapse;min-width:640px;font-size:15px}
.cmpt th,.cmpt td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}
.cmpt th{background:var(--surface2);font-weight:500;width:140px}
.scroll{overflow-x:auto}
.initt{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.initt .blk{margin:0}
.initt h2 .ini{font-size:16px;height:30px;min-width:30px}
.initt ul{margin:4px 0 0;padding-left:18px}
/* battle */
.bt{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.bt{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--fp);border-radius:4px;padding:14px}
.side.sh{border-top-color:var(--sh)}
.side h2{font-size:26px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.num{display:inline-flex;align-items:center;gap:4px}
.num button{width:30px;height:30px;border:1px solid var(--line);background:var(--surface2);border-radius:5px}
.num input{width:44px;text-align:center;padding:4px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 0}
.chk label{display:flex;gap:6px;align-items:center;font-size:15px}
.situ{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px}
.situ .chk label{font-size:16px}
select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.res{margin-top:12px}
.big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.stats div{min-width:80px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}
.bars div{flex:1;background:var(--fp);min-height:1px;position:relative;border-radius:2px 2px 0 0}
.side.sh .bars div{background:var(--sh)}
.bars span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted)}
.bars em{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-style:normal;color:var(--muted)}
.ok{color:#2E7D3A}.no{color:var(--muted);text-decoration:line-through}.maybe{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ok{color:#7FCB8A}}
:root[data-theme="dark"] .ok{color:#7FCB8A}
.cbl{list-style:none;padding:0;margin:6px 0 0;font-size:15px}
.cbl li{padding:4px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.cbl .why{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
.note{font-size:14px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* tracker */
.tk{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.tk{grid-template-columns:1fr}}
.crow{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line);font-size:15px}
.crow .st{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.crow .st button{border:0;background:var(--surface2);padding:2px 7px;font-size:13px;border-right:1px solid var(--line)}
.crow .st button:last-child{border-right:0}
.crow .st button.on{background:var(--ink);color:var(--bg)}
.crow.done .cn{text-decoration:line-through;color:var(--muted)}
.state{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pol{display:grid;grid-template-columns:1fr auto auto;gap:6px 10px;align-items:center;font-size:15px}
/* hunt */
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{width:64px;height:64px;border-radius:6px;border:2px solid var(--line);background:#DCCFA8;color:#3B2E10;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:22px;position:relative}
.tok small{font-size:10px;font-weight:500}
.tok.fp{background:#9DBAD6;color:#122638}.tok.sh{background:#C9786C;color:#2B0D08}
.tok.drawn{opacity:.45}.tok.removed{opacity:.2;text-decoration:line-through}
.tok.off{opacity:.35}
.tok.wide{width:120px;height:auto;min-height:64px;padding:6px 4px 16px;text-align:center}
.tok.aside{border-style:dashed;opacity:.6}
.tok .r{position:absolute;bottom:2px;right:4px;font-size:12px}
.tok .s{position:absolute;bottom:2px;left:4px;font-size:12px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--muted);margin:8px 0}
/* dice */
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.face{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;border-top:4px solid var(--fp)}
.face.sh{border-top-color:var(--sh)}
.face .g{line-height:1;margin-bottom:4px}
.die{display:block;width:84px;height:84px;object-fit:cover;border-radius:14px;box-shadow:0 2px 5px rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.2)}

.seg button{display:inline-flex;align-items:center;gap:5px}.seg button .di{margin:0;vertical-align:0}.dis{display:inline-flex;gap:3px}
@media (max-width:480px){.seg{max-width:100%}.seg button{padding:6px 8px}.seg button:has(.di){flex-direction:column;gap:3px;font-size:15px}.x{flex-direction:column;gap:3px;font-size:15px}.seg button .di{width:1.7em;height:1.7em}}
.di{display:inline-block;width:1.45em;height:1.45em;object-fit:cover;border-radius:5px;vertical-align:-.4em;margin-right:2px}
.face h3{font-size:22px;margin:4px 0}
.face ul{margin:4px 0 0;padding-left:18px;font-size:15px}
.sec{margin:28px 0 10px;font-size:30px}
.sub{color:var(--muted);margin:-4px 0 12px;max-width:70ch}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
 <div class="topin">
  <div class="brand">Война Кольца<small>справочник по правилам, альманаху и картам · базовая игра, 2-е изд.</small></div>
  <div class="search"><input id="q" type="search" placeholder="Найти: бой, арьергард, Слова силы, штурм…" autocomplete="off" aria-label="Поиск"><div class="sres" id="sres"></div></div>
  <button class="theme" id="themeBtn" title="Светлая/тёмная тема">Тема</button>
 </div>
 <nav class="tabs" id="tabs">
  <a href="#t/rules" data-t="rules">Справочник</a>
  <a href="#t/cards" data-t="cards">Карты</a>
  <a href="#t/battle" data-t="battle">Бой</a>
  <a href="#t/game" data-t="game">Партия</a>
  <a href="#t/hunt" data-t="hunt">Охота</a>
  <a href="#t/dice" data-t="dice">Кубики</a>
 </nav>
</header>
<main id="main"></main>
<div class="tray" id="tray"></div>
<script>
// Справочник правил. Ссылки: [[id]] или [[id|текст]], на карту: [[c:ID|текст]]
const ENT = {};
function E(id, t, g, tags, b) { ENT[id] = { id, t, g, tags, b }; }
// g — группа в оглавлении

/* ---------- Ход и кубики ---------- */
E('turn','Ход игры: шесть фаз','Ход и кубики','ход раунд фазы порядок',`
<ol>
<li><b>Возврат кубиков и добор карт.</b> Каждый возвращает свои [[dice|кубики действий]] (с учётом добавленных и убранных), затем берёт по 1 карте из каждой своей колоды. Сразу проверьте [[hand|лимит руки]].</li>
<li><b>Фаза Братства.</b> СН может [[declare|объявить Братство]], сменить [[guide|проводника]] и войти в [[mordor|Мордор]] из Мораннона или Минас Моргула.</li>
<li><b>Начало Охоты.</b> Тьма кладёт кубики в [[hunt-box|ячейку Охоты]]: максимум — число спутников в Братстве, но 1 кубик можно всегда. Обязана положить хотя бы 1, если в конце прошлого хода в ячейке был кубик СН.</li>
<li><b>Бросок действий.</b> Кубики из ячейки Охоты не бросаются. Все выпавшие «Око» Тьма сразу кладёт в ячейку Охоты.</li>
<li><b>Действия.</b> По очереди по одному кубику, начиная со СН. Можно [[pass|пасовать]] или пропустить действие, сбросив кубик. Кубик, которым двигали Братство, идёт в ячейку Охоты.</li>
<li><b>Проверка победы.</b> Только [[victory|военная победа]]. Победа по Кольцу наступает мгновенно в любой момент.</li>
</ol>
<p>Полученный или потерянный кубик действия вступает в силу только с фазы 1 следующего хода.</p>`);

E('dice','Кубики действий','Ход и кубики','кубик грани действие персонаж войско сбор событие воля запада око',`
<p>Тьма начинает с 7 кубиками (до 10: +1 за [[saruman|Сарумана]], [[witch-king|Короля-чародея]], [[mouth|Голос Саурона]]). СН — с 4 (+1 за [[strider|Арагорна]], +1 за [[gandalf-white|Гэндальфа Белого]]). Кубик теряется при гибели персонажа (со следующего хода).</p>
<p><b>Грани СН:</b> Персонаж ×2, Сбор, Войско/Сбор, Событие, Воля Запада. «Войско» у СН есть только вместе со «Сбором».<br>
<b>Грани Тьмы:</b> Персонаж, Войско, Сбор, Войско/Сбор, Событие, Око.</p>
<ul>
<li><b>Персонаж</b>: передвинуть/атаковать войском с лидером или персонажем; сыграть героическую карту; СН — двигать Братство ([[fs-move]]), [[hide|спрятать]], [[separate|отделить]] или двигать спутников; Тьма — двигать [[nazgul|назгулов]] и прислужников.</li>
<li><b>Войско</b>: [[army-move|передвинуть до двух разных войск]] или атаковать одним; сыграть карту «войско».</li>
<li><b>Сбор</b>: [[politics|дипломатия]] (+1 по шкале), [[muster|найм]], карта «сбор», ввести прислужника (Тьма).</li>
<li><b>Войско/Сбор</b>: любое из двух.</li>
<li><b>Событие</b>: взять карту из любой своей колоды или сыграть любую карту.</li>
<li><b>Воля Запада</b>: любой другой символ; либо ввести [[gandalf-white|Гэндальфа Белого]] / [[strider|Арагорна]].</li>
<li><b>Око</b>: сразу в ячейку Охоты, действием не является.</li>
</ul>
<p>См. также вкладку «Кубики» с вероятностями и [[elven|Эльфийские кольца]].</p>`);

E('pass','Пас и пропуск','Ход и кубики','пас пропуск',`
<p><b>Пас:</b> если неиспользованных кубиков меньше, чем у соперника, можно не действовать — соперник делает ещё одно действие. <b>Пропуск:</b> сбросить кубик без эффекта. Если кубики закончились у одного игрока, второй совершает оставшиеся действия подряд.</p>`);

E('elven','Эльфийские кольца','Ход и кубики','кольца эльфийские смена грани',`
<ul>
<li>Когда ваша очередь действовать, можно сменить грань одного неиспользованного кубика на любую. Это не действие.</li>
<li>Не чаще 1 кольца за ход на игрока.</li>
<li>СН не может превратить кубик в «Волю Запада». Использованное кольцо переворачивается и уходит Тьме; Тьма использует его 1 раз и убирает из игры.</li>
<li>Тьма может сделать «Око» — кубик сразу в ячейку Охоты; превратить «Око» во что-то другое нельзя.</li>
<li>Изменённый кубик не обязательно разыгрывать сразу.</li>
</ul>
<p>Примеры: [[c:fp-h-13|Зеркало Галадриэли]] позволяет кольцом сделать «Персонаж» и затем превратить в «Волю Запада»; сброс [[c:sh-h-21|Палантира Ортханка]] требует кольца.</p>`);

/* ---------- Карты ---------- */
E('events','Карты событий: общие правила','Карты','карта событие условие обязательный текст',`
<ul>
<li>Разыграть можно кубиком «Событие» или кубиком с символом карты (правый верхний угол).</li>
<li>Карта нарушает правила только там, где это прямо сказано. Например, найм в захваченном поселении возможен лишь если карта это прямо разрешает ([[c:fp-h-22|Мертвецы Дунхарга]]).</li>
<li><b>Жирный текст</b> — обязательное условие розыгрыша (в том числе для карт [[table-cards|«Выложите на стол»]]).</li>
<li>Основной текст обязателен и выполняется максимально полно; необязательно только то, что сказано через «можете». Если часть эффекта невозможна — выполните остальное.</li>
<li>Разыграть карту без эффекта можно (блеф, добор за [[witch-king|«Колдуна»]]), но условие розыгрыша должно выполняться.</li>
<li>Поселения в тексте карт — малые, большие города и крепости. [[fortifications|Укрепления]] поселениями не являются.</li>
<li>Если колода закончилась, сброс не замешивается — из неё больше не берут.</li>
<li>Карта, наносящая потери: если уничтожены все отряды войска, лидеры СН уходят с ним, а назгулы, спутники и прислужники остаются в регионе.</li>
</ul>
<p>См. [[hand]], [[combat-cards]], [[muster-cards]].</p>`);

E('table-cards','«Выложите на стол»','Карты','стол выложите сброс постоянные',`
<ul>
<li>Выкладывается кубиком действия при выполнении условия. На столе не считается в [[hand|лимите руки]].</li>
<li>Сбрасывается, когда выполнено условие сброса или когда перестаёт выполняться условие розыгрыша (проверяется в конце действия).</li>
<li>Если сброс требует кубика — это действие.</li>
<li>Карты на столе нельзя сбросить как «карту из руки» (например, для снятия [[c:fp-s-2|Силы слишком велики]]).</li>
</ul>
<p>Охота: на один вытянутый жетон — только одна из карт [[c:fp-h-6|Лук и топор]] / [[c:fp-h-7|Рог Гондора]].</p>`);

E('hand','Лимит руки','Карты','рука лимит шесть сброс',`
<p>Максимум 6 карт (при игре вчетвером — 4). Сначала возьмите все карты текущего добора, затем сбросьте лишние лицом вниз.</p>
<p>Пример: у СН 6 карт, кубиком «Событие» сыгран [[c:fp-h-23|Дом наместников]], проводник — [[gandalf-grey|Гэндальф Серый]]. Берёте 2 стратегические → 7, сбрасываете до 6; затем карту за Гэндальфа → 7, снова сбрасываете до 6.</p>`);

E('combat-cards','Боевые карты','Карты','боевая карта нижняя часть раунд',`
<ul>
<li>Нижняя часть любой карты события — боевой эффект. Использование не требует действия.</li>
<li>В начале каждого [[battle|боевого раунда]] сначала [[attacker|атакующий]] выбирает карту (или нет), затем [[defender|защищающийся]]; рубашка видна, карты раскрываются одновременно.</li>
<li>Действует только в текущем раунде, сбрасывается после него.</li>
<li>Жирное условие под названием обязательно. «Откажитесь от лидерства» — эта фигурка не даёт лидерство в этом раунде; нельзя отказаться от уже отменённого лидерства ([[forfeit]]).</li>
<li>Очерёдность — по [[initiative|инициативе]].</li>
<li>Дополнительные атаки до боевого броска или после потерь: без переброса за лидерство, модификаторы соперника не действуют, потери снимаются сразу.</li>
<li>Этикет: если карта сыграна по ошибке (условие не выполнено), обычно её разрешают вернуть в руку.</li>
</ul>`);

E('initiative','Инициатива','Карты','инициатива порядок очередность',`
<p>Чем меньше число — тем раньше срабатывает. При равенстве первой действует карта защищающегося. Если у карты несколько эффектов ([[c:sh-s-7|Мумаки]]) — у каждого своя инициатива.</p>
<ul>
<li><b>0</b> — отмена боевой карты</li>
<li><b>1</b> — перед боевым броском</li>
<li><b>2</b> — бросок кубиков перед битвой</li>
<li><b>3</b> — [[roll|боевой бросок]]</li>
<li><b>4</b> — [[reroll|переброс за лидерство]]</li>
<li><b>5</b> — после переброса</li>
<li><b>6</b> — перед [[casualties|потерями]]</li>
<li><b>7</b> — после потерь</li>
</ul>
<p>Таблица всех боевых карт по инициативе — во вкладке «Карты».</p>`);

/* ---------- Бой ---------- */
E('battle','Бой (битва)','Бой','бой битва сражение раунд атака',`
<p><b>Начать бой</b> могут только войска народов [[at-war|«в войне»]] кубиком «Войско», «Персонаж» (в войске есть лидер/персонаж) или картой с эффектом атаки. Атакуют войско в соседнем регионе, либо в том же регионе — [[assault|штурм]] / [[sortie|вылазка]]. Атакующие отряды на время боя не перемещаются.</p>
<p><b>Объявление атаки.</b> [[attacker|Атакующий]] может выделить [[rearguard|арьергард]]. Если [[defender|защищающийся]] в регионе со своей неосаждённой крепостью — может [[retreat-fortress|отступить в крепость]] (бой заканчивается). Если в регионе осаждённая крепость — это [[assault|штурм]] или [[sortie|вылазка]], иначе — полевое сражение. [[gandalf-white|Гэндальф Белый]] объявляет «Белого Всадника» сейчас — на всю битву.</p>
<p><b>Каждый раунд:</b></p>
<ol>
<li>[[combat-cards|Боевые карты]] (атакующий, затем защищающийся, раскрытие одновременно). Сразу снимаются потери от доп. атак инициативы 2.</li>
<li>[[roll|Боевой бросок]] — кубиков = [[strength|боевая сила]], максимум 5.</li>
<li>[[reroll|Переброс за лидерство]].</li>
<li>[[casualties|Потери]] — атакующий решает первым. Затем эффекты инициативы 7. Если уничтожены все отряды войска — уничтожаются и все его лидеры, назгулы, персонажи.</li>
<li>[[ceasefire|Атакующий может прекратить атаку]], иначе защищающийся может [[retreat|отступить]] — или новый раунд.</li>
</ol>
<p><b>Конец битвы:</b> атака прекращена, защищающийся отступил или одно/оба войска уничтожены. Если уничтожены оба, защищающийся сохраняет контроль над поселением; при обоюдном уничтожении в штурме/вылазке контроль получает/сохраняет арьергард. Если защищающийся уничтожен или отступил, атакующее войско (всё, часть или никто, кроме арьергарда) может войти в регион; при вражеской крепости с отрядами — начинается [[siege|осада]].</p>
<p>Особые случаи: [[city-attack|атака города/укрепления]], [[fortress]], [[siege]], [[relief|прорыв осады]]. Король-чародей: [[witch-king|«Колдун»]] — добор после шага 5 первого раунда. Политика: любая атака продвигает и активирует атакованные народы ([[advance]]).</p>
<p>Посчитать шансы — во вкладке «Бой».</p>`);

E('attacker','Атакующий','Бой','атакующий атака нападение',`
<ul>
<li>Начинает бой действием или картой; отряды остаются в своём регионе на всё время боя.</li>
<li>В атаку идут только отряды народов «в войне»; невоюющие обязательно остаются в [[rearguard|арьергарде]]. Назгулы и персонажи всегда считаются «в войне» ([[characters-war]]).</li>
<li>При атаке действием «Персонаж» в атакующем войске должен быть хотя бы 1 лидер или персонаж.</li>
<li>Первым выбирает [[combat-cards|боевую карту]]; первым решает, какие отряды убрать при [[casualties|потерях]].</li>
<li>В конце раунда решает: [[ceasefire|прекратить]] или продолжать.</li>
<li>В первом раунде против [[city-attack|города или укрепления]] попадает на 6; при [[assault|штурме]] — на 6 каждый раунд.</li>
<li>После победы может войти в регион (без арьергарда).</li>
</ul>`);

E('defender','Защищающийся','Бой','защищающийся оборона защита',`
<ul>
<li>Всё войско защищающегося (отряды, лидеры, персонажи) всегда участвует в битве — арьергарда нет.</li>
<li>При атаке региона со своей неосаждённой крепостью в начале каждого раунда выбирает: полевое сражение или [[retreat-fortress|отступление в крепость]].</li>
<li>Выбирает [[combat-cards|боевую карту]] вторым; при равной [[initiative|инициативе]] его карта срабатывает первой.</li>
<li>Если атакующий продолжает, может [[retreat|отступить]] в конце раунда.</li>
<li>Если оба войска уничтожены — сохраняет контроль над поселением.</li>
<li>Многие боевые карты требуют условий от защищающегося войска (местность, Братство в регионе): [[c:fp-s-3|Выгодная позиция]], [[c:fp-h-19|Ярость энтов]], [[c:fp-h-1|Это подарок]], [[c:sh-h-1|Одно для Тёмного Властелина]].</li>
</ul>`);

E('rearguard','Арьергард','Бой','арьергард резерв разделение',`
<ul>
<li>Создаёт только атакующий, при объявлении атаки. В каждой части должен быть минимум 1 военный отряд; лидеры, спутники, назгулы, прислужники распределяются как угодно.</li>
<li>Не участвует в битве, не может быть целью боевых карт, не может нести потери, не входит в регион после победы.</li>
<li>Отряды невоюющих народов обязаны остаться в арьергарде.</li>
<li>Персонаж в арьергарде не даёт своих эффектов: [[witch-king|«Колдун»]] не срабатывает. Но для [[c:sh-h-20|Гронда]] Король-чародей может быть в арьергарде, а для [[c:sh-h-24|Чёрного Предводителя]] — нет. Для [[c:sh-s-2|Урук-хай]] отряд Изенгарда может быть в арьергарде.</li>
<li>При обоюдном уничтожении в штурме/вылазке контроль над крепостью достаётся стороне с арьергардом.</li>
<li>На вылазке арьергард остаётся в крепости.</li>
</ul>`);

E('strength','Боевая сила','Бой','боевая сила кубики число отрядов',`
<p>Сумма военных отрядов (обычных и элитных) в бою. Кубиков боевого броска = боевая сила, но не больше 5. Лишние отряды дают «запас прочности» при [[casualties|потерях]].</p>
<p>Лидеры, назгулы и персонажи боевой силы не дают. Исключение: [[gandalf-grey|Гэндальф Серый]] «Предводитель Запада» +1 к боевой силе (максимум 5 кубиков всё равно).</p>
<p>Ограничения кубиков: [[c:fp-s-1|Дневной свет]] (Тьма ≤3), [[c:fp-h-20|Мрак хуорнов]] (Тьма ≤2), [[c:sh-h-8|Ужас и отчаяние]] (снижает силу СН).</p>`);

E('leadership','Лидерство','Бой','лидерство лидер переброс назгулы',`
<p>Лидерство войска = число лидеров (назгулы — лидеры, по 1) + лидерство персонажей с карт. Определяет число кубиков [[reroll|переброса]], максимум 5.</p>
<ul>
<li>Лидерство персонажей: Гэндальф Серый/Белый 1, Странник 1, Арагорн 2, Боромир 1, Леголас 1, Гимли 1, Мериадок 1, Перегрин 1; Король-чародей 2 (но для эффектов «за назгула» считается одним назгулом), Голос Саурона 2, Саруман 1. <i>Сверьте с картами персонажей.</i></li>
<li>Если [[saruman|Саруман]] в игре, элитные отряды Изенгарда дают и лидерство.</li>
<li>«Лидерство назгулов» — только назгулы и Король-чародей; карты [[c:sh-h-8|Ужас и отчаяние]], [[c:sh-h-9|Мерзкий смрад]], [[c:sh-h-7|Они ужасны]], [[c:sh-h-5|Беспощадные, как смерть]] его требуют. [[gandalf-white|«Белый Всадник»]] его отменяет.</li>
</ul>
<p>См. [[forfeit]].</p>`);

E('forfeit','Отказ от лидерства','Бой','отказ лидерства',`
<p>Карта требует «отказаться от лидерства» — выбранная фигурка не учитывается в лидерстве в этом раунде. Нельзя отказаться от лидерства, которое уже отменено (например, [[c:sh-h-15|Словами силы]]) или потрачено ([[gandalf-white|«Белый Всадник»]]).</p>
<p>Отказ части лидерства не влияет на остальное: при лидерстве 8 и отказе 4 спутников на переброс остаётся 4 (максимум 5 кубиков).</p>`);

E('roll','Боевой бросок','Бой','бросок кубики попадание 5 6',`
<p>Каждый бросает кубики по [[strength|боевой силе]] (≤5). Попадание — 5 или 6. Атакующий попадает на 6 в первом раунде против [[city-attack|города/укрепления]] и в каждом раунде [[assault|штурма]].</p>
<p>«1» — всегда промах, «6» — всегда попадание, при любых [[mods|модификаторах]].</p>`);

E('reroll','Переброс за лидерство','Бой','переброс лидерство',`
<p>После боевого броска каждый перебрасывает свои промахи, но не больше своего [[leadership|лидерства]] (≤5). Порог попадания тот же, если карта не меняет его. Перебросить можно только один раз.</p>
<p>Пример: 5 отрядов и 3 лидера, бросок 1,3,5,5,6 — 3 попадания, промахов 2 → перебрасываются 2 кубика.</p>
<p>Отменяется [[c:sh-h-9|Мерзким смрадом]]. Карты на переброс: [[c:fp-h-9|Андрил]], [[c:fp-h-6|Могучая атака]], [[c:sh-h-7|Они ужасны]], [[c:sh-h-11|Чёрное дыхание]], [[c:fp-h-5|Клинок Западного Края]], [[c:fp-h-12|Судьбоносный удар]].</p>`);

E('mods','Модификаторы бросков','Бой','модификатор плюс минус',`
<p>«Добавьте 1» и т.п. прибавляется к значению каждого кубика, затем сравнивается с порогом. Модификаторы суммируются. 1 — всегда промах, 6 — всегда попадание.</p>
<p>Пример: [[c:sh-s-1|Смертельная вражда]] +2 и [[c:fp-h-19|Ярость энтов]] +2 при пороге 5 → попадание на 2+ (1 всё равно промах).</p>
<p>Модификаторы соперника не влияют на дополнительные атаки до боевого броска или после потерь ([[c:sh-s-13|Мы пришли убивать]], [[c:sh-s-2|Натиск]], [[c:fp-h-14|Внезапный удар]]).</p>`);

E('casualties','Потери в бою','Бой','потери попадания элитный понижение уничтожение',`
<p>Атакующий решает первым. За каждое попадание: убрать 1 обычный отряд или понизить 1 элитный до обычного (того же народа). 2 попадания можно снять одним элитным.</p>
<ul>
<li>Замена при понижении берётся из потерь этого боя, иначе из подкреплений; если обычного отряда нет — элитный уничтожается.</li>
<li>Потери СН выбывают навсегда; потери Тьмы возвращаются в подкрепления.</li>
<li>Лидер не может быть потерей. Если уничтожены все отряды — уничтожаются все лидеры и персонажи этого войска (персонажи — навсегда, назгулы — в подкрепления).</li>
</ul>
<p>Отличие от [[casualty-hunt|потери в Охоте]] и [[removal|удаления]].</p>`);

E('ceasefire','Прекращение атаки','Бой','прекращение остановка атаки',`
<p>В конце каждого раунда атакующий может прекратить атаку — его отряды остаются на месте. Карты могут запретить прекращение: [[c:sh-s-10|Пираты Умбара]]; [[c:sh-h-20|Гронд]] и [[c:sh-s-2|Урук-хай]] требуют минимум 3 раунда. При [[sortie|вылазке]] прекращение возвращает войско в крепость.</p>`);

E('retreat','Отступление','Бой','отступление отступить свободный регион',`
<ul>
<li>Если атакующий продолжает, защищающийся в конце раунда может отступить всем войском в соседний [[free-region|свободный регион]] (нет войск противника и подконтрольного ему поселения; регион с вражеской крепостью, которую осаждает ваше войско, свободен).</li>
<li>Невоюющие народы могут отступать через чужие границы, но при следующем передвижении должны покинуть чужие земли ([[at-war]]).</li>
<li>Нельзя отступить из осаждённой крепости. Персонаж уровня 0 не отступает.</li>
<li>При отступлении можно превысить [[stacking|предел]] — лишние сразу в подкрепления (это не потери).</li>
<li>Отступление — не передвижение: спутник, отступивший в город/крепость, народ не активирует.</li>
</ul>
<p>Карта [[c:fp-s-5|Разведчики]] даёт отступление до боевого броска. См. также [[retreat-fortress]].</p>`);

E('retreat-fortress','Отступление в крепость','Бой','отступление крепость осада',`
<p>Защищающийся в регионе со своей неосаждённой крепостью может в начале любого раунда отступить в неё. Атака заканчивается; атакующий может сразу войти в регион (всем войском или частью) — начинается [[siege|осада]]. В крепости максимум 5 отрядов, лишние — в подкрепления.</p>
<p>Через [[c:fp-s-5|Разведчиков]] СН может отступить в крепость, «выманив» боевую карту Тьмы.</p>`);

E('city-attack','Атака города или укрепления','Бой','город укрепление первый раунд 6',`
<p>При атаке региона с городом (малым или большим) или [[fortifications|укреплением]] атакующий попадает только на 6 в первом раунде. Дальше — по обычным правилам. Крепости — см. [[fortress]].</p>`);

E('fortress','Крепость','Бой','крепость защита',`

<li>Может раскрыть Братство, чтобы снизить урон Охоты на 1 (если оно ещё не раскрыто; не с [[c:sh-h-6|Проклятьем Исилдура]], не в незахваченной крепости СН после объявления).</li>
<li>Игнорирует символ «раскрыть» только на обычных числовых жетонах; «Око» и особые жетоны Тьмы с «раскрыть» раскрывают всегда.</li>
<li>Если Голлум проводник, при [[c:sh-h-7|Твари из бездны]] снизить урон случайной потерей нельзя (спутников нет); [[c:fp-h-11|Я пойду один]] разыграть нельзя.</li>
</ul>`);

E('minions','Прислужники','Персонажи','прислужник саруман король-чародей голос саурона',`<p>[[saruman|Саруман]], [[witch-king|Король-чародей]], [[mouth|Голос Саурона]]. Вводятся кубиком «Сбор» по условиям на картах персонажей, дают +1 кубик действия. Без войска не входят в регион с крепостью СН, если она не осаждена Тьмой. Уничтоженный прислужник выбывает навсегда (теряется кубик).</p>`);

E('nazgul','Назгулы','Персонажи','назгул призрак кольца',`
<ul>
<li>Лидеры Тьмы (1 лидерство каждый). Двигаются кубиком «Персонаж» в любой регион (все сразу), кроме региона с крепостью СН, не осаждённой Тьмой.</li>
<li>Игнорируют вражеские войска; могут быть без войска.</li>
<li>Нанимаются только в крепостях Саурона (Саурон в войне); убитые возвращаются в подкрепления.</li>
<li>Король-чародей считается назгулом во всех текстах, кроме прямого упоминания по имени ([[c:fp-h-18|Орлы приближаются!]] — не считается). Голос Саурона — не назгул.</li>
<li>Назгул в регионе Братства даёт переброс Охоты ([[hunt-rerolls]]).</li>
</ul>`);

E('witch-king','Король-чародей','Персонажи','король-чародей колдун',`
<p>Лидерство 2, движение как у назгула. Вводится, если Саурон и хотя бы один СН «в войне»; ставится в любой регион с войском Саурона; при входе активирует все СН (но не если на столе [[c:sh-h-22|Гнилоуст]] — для Рохана). <i>Сверьте с картой.</i></p>
<p><b>Колдун:</b> если Король-чародей участвует в битве (не в арьергарде) и вы сыграли боевую карту в первом раунде — возьмите карту из колоды того же типа. Добор — после решений шага 5 (продолжение, отступление, понижение элитного при штурме). Если убит в первом раунде — не срабатывает.</p>
<p>С [[c:sh-h-21|Палантиром Ортханка]]: сначала карта за «Колдуна», после действия — за Палантир.</p>`);

E('saruman','Саруман','Персонажи','саруман изенгард',`<p>Уровень 0 (не покидает Ортханк), лидерство 1. Вводится при Изенгарде «в войне». Пока в игре — элитные отряды Изенгарда считаются и лидерами. Его гибель сбрасывает [[c:sh-h-21|Палантир Ортханка]] и [[c:sh-h-22|Гнилоуста]]. Уничтожается [[c:fp-h-19|Энтами]] без войска в Ортханке. <i>Сверьте с картой.</i></p>`);

E('mouth','Голос Саурона','Персонажи','голос саурона уста',`<p>Лидерство 2, двигается сам до 3 регионов, не назгул. Как спутники — не пересекает чёрных границ, игнорирует войска, не входит/не выходит из региона с дружественной осаждённой крепостью. <i>Сверьте условия ввода и способности с картой.</i></p>`);

/* ---------- Братство ---------- */
E('fellowship','Братство Кольца','Братство','братство хранители',`
<p>Хранители Кольца (Фродо и Сэм — одна миниатюра) + спутники в ячейке Братства. Миниатюра показывает последнее известное местоположение; [[fsp-track|жетон прогресса]] — сколько пройдено от него и спрятано ли Братство.</p>
<p>См. [[guide]], [[fs-move]], [[declare]], [[reveal]], [[hide]], [[separate]], [[corruption]], [[hunt]], [[mordor]].</p>`);

E('guide','Проводник','Братство','проводник смена',`
<p>Проводник — спутник наивысшего уровня (при равенстве — выбор СН). Сменить можно в конце фазы Братства или при любом изменении состава. Доступна только способность «Проводник». Если спутников не осталось — [[gollum|Голлум]].</p>
<p>Если новый проводник появился во время Охоты, его способность доступна сразу.</p>`);

E('fsp-track','Шкала Братства','Братство','шкала прогресс спрятано раскрыто',`<p>Жетон прогресса: число пройденных регионов от миниатюры; сторона «спрятано» / «раскрыто». Там же жетон [[corruption|влияния Кольца]] (0–12).</p>`);

E('fs-move','Передвижение Братства','Братство','передвижение братства охота',`
<ul>
<li>Кубик «Персонаж»: +1 на шкале Братства (Братство должно быть спрятано). Затем [[hunt-roll|Охота]], затем кубик — в ячейку Охоты.</li>
<li>Картой события: кубик розыгрыша в ячейку <b>не</b> кладётся, но Охота проводится ([[c:fp-h-10|Есть и другой путь]]).</li>
<li>Каждый кубик СН в ячейке даёт +1 к броскам Охоты.</li>
</ul>`);

E('declare','Объявление Братства','Братство','объявление объявить',`
<ul>
<li>В фазу Братства, если спрятано. Миниатюра перемещается на ≤ прогресса регионов (можно остаться), прогресс → 0, остаётся «спрятано».</li>
<li>В незахваченном большом городе/крепости СН: влияние −1 ([[heal]]), активация народа.</li>
<li>Сбрасывает [[c:fp-s-1|Последнюю битву]]; в незахваченном городе/крепости СН позволяет сбросить [[c:sh-h-15|Горе и страдания]] и [[c:sh-h-16|Стаи воронов]].</li>
<li>Определённые эффекты могут дать жетон Охоты при объявлении — символ «раскрыть» на нём игнорируется, если объявлено в городе/крепости СН.</li>
<li>Объявление в Моранноне/Минас Моргуле для входа в [[mordor|Мордор]] — сбрасывает Последнюю битву.</li>
</ul>`);

E('reveal','Раскрытие Братства','Братство','раскрытие раскрыто',`
<ul>
<li>От жетона с «раскрыть» или карт. Жетон переворачивается; СН двигает миниатюру на ≤ прогресса, но не в регион с крепостью или большим городом СН.</li>
<li>Раскрытое Братство нельзя двигать кубиком, пока не [[hide|спрятано]]; уязвимо к картам «Братство раскрыто».</li>
<li>Путь через/в/из/оставаясь в крепости Тьмы под контролем Тьмы — жетон Охоты за каждую ([[sh-strongholds]]).</li>
<li>Порядок жетонов: сначала тот, что раскрыл, затем от карт/способностей ([[c:sh-h-17|Балрог]]), затем за крепости.</li>
</ul>`);

E('hide','Сокрытие Братства','Братство','спрятать сокрытие',`<p>Кубиком «Персонаж» (или картой, например [[c:fp-h-10|Есть и другой путь]]) — жетон на сторону «спрятано». В этом же действии не двигается, кубик в ячейку Охоты не кладётся.</p>`);

E('separate','Отделение спутников','Братство','отделение отделить',`
<ul>
<li>Кубиком «Персонаж»: спутник или группа ставится в регион Хранителей и двигается на ≤ прогресс + уровень (группа — по высшему уровню), одним маршрутом.</li>
<li>Если Хранители в осаждённой дружественной крепости — отделённые оказываются в крепости и не могут уйти.</li>
<li>Состав изменился — можно сменить [[guide|проводника]].</li>
<li>На шкале Мордора отделение запрещено; эффекты отделения удаляют спутника из игры.</li>
</ul>
<p>Карты: [[c:fp-h-11|Я пойду один]], [[c:fp-h-15|Гвайхир]], [[c:fp-h-16|Лёгкая поступь]], [[c:fp-h-17|Туда и обратно]].</p>`);

E('corruption','Влияние Кольца','Братство','влияние кольца порча 12',`<p>От 0 до 12. Растёт от урона Охоты и карт, падает при отдыхе ([[heal]]) и от карт. На 12 — мгновенная победа Тьмы. Не может быть ниже 0.</p>`);

E('heal','Понижение влияния','Братство','понижение влияния отдых',`<p>Объявили в фазу Братства в незахваченном большом городе/крепости СН — влияние −1. Можно повторять каждый ход (Братство должно быть спрятано). Карты: [[c:fp-h-9|Ателас]], [[c:fp-h-12|Песнь Бильбо]], [[c:fp-h-10|Есть и другой путь]], [[c:fp-h-11|Я пойду один]], [[c:fp-h-13|Зеркало]]; жетоны −1/−2 в Мордоре.</p>`);

E('sh-strongholds','Братство в крепостях Тьмы','Братство','крепость тьмы раскрыто мория',`<p>Если раскрытое Братство проходит через, входит, выходит или остаётся в крепости Тьмы под контролем Тьмы — жетон Охоты за каждую. «Око» на таком жетоне = 0. Захваченная СН крепость Тьмы жетона не даёт; захваченная Тьмой крепость СН — не считается.</p>`);

/* ---------- Охота ---------- */
E('hunt','Охота за Кольцом','Охота','охота',`<p>Порядок: [[hunt-box|ячейка]] → [[hunt-roll|бросок]] с [[hunt-rerolls|перебросами]] → [[hunt-damage|жетон и урон]] → [[hunt-effects|применение эффектов]]. Состав — [[hunt-pool]]. Трекер жетонов — во вкладке «Охота».</p>`);

E('hunt-box','Ячейка Охоты','Охота','ячейка охоты кубики',`<p>Уровень Охоты = кубики Тьмы в ячейке (положенные в фазу 3 + все «Око»). Кубики СН за передвижения Братства дают +1 к каждому кубику Охоты. [[c:sh-h-18|Всевидящее Око]] и эльфийское кольцо могут добавить кубик Тьмы позже.</p>`);

E('hunt-roll','Бросок Охоты','Охота','бросок охоты успех 6',`<p>При каждом передвижении Братства Тьма бросает кубики боя по уровню Охоты (максимум 5). Успех — 6, +1 за каждый кубик СН в ячейке. 1 — всегда неудача. Нужен хотя бы 1 успех. [[c:sh-h-16|Стаи воронов]]: +1 ко всем кубикам броска и переброса.</p>`);

E('hunt-rerolls','Перебросы Охоты','Охота','переброс охоты',`<p>По 1 перебросу за каждое условие в регионе Братства: крепость под контролем Тьмы; хотя бы 1 военный отряд Тьмы; хотя бы 1 назгул. Максимум 3. Бонус +1 от кубиков СН действует.</p>`);

E('hunt-damage','Урон Охоты и жетоны','Охота','урон жетон око',`
<ul>
<li>Числовой жетон — урон равен числу.</li>
<li>«Око» — урон = число успехов в броске (включая перебросы). Если жетон вытянут за крепость Тьмы или картой — 0. В Мордоре — число кубиков в ячейке Охоты (включая кубики СН).</li>
<li>«Раскрыть» — Братство раскрывается после прочих эффектов.</li>
<li>Особые: «кубик» — урон = бросок кубика (считается числовым); отрицательное — снижение влияния; «стоп» — Братство не движется в Мордоре.</li>
</ul>`);

E('hunt-effects','Применение эффектов Охоты','Охота','порядок эффектов охоты',`
<ol>
<li>После вытягивания (тянуть можно не дать [[c:fp-h-8|Посохом волшебника]], перетянуть — [[c:fp-h-5|Мифриловой кольчугой]]) — только одна карта со стола: [[c:fp-h-6|Лук и топор]] или [[c:fp-h-7|Рог Гондора]].</li>
<li>Способности проводника (Мериадок, Перегрин, Голлум) и/или [[casualty-hunt|потеря спутника]]. Если появился новый проводник — его способность сразу.</li>
<li>Остаток урона — +влияние Кольца.</li>
<li>Раскрытие, если требуется. Голлум-проводник игнорирует «раскрыть» только на обычных числовых жетонах.</li>
</ol>`);

E('casualty-hunt','Потеря спутника в Охоте','Охота','потеря спутник случайный проводник',`<p>Чтобы снизить урон, СН уничтожает проводника или случайного спутника (Тьма тянет вслепую жетон спутника из ячейки). Урон снижается на уровень спутника; излишек — во влияние. Если урон меньше уровня — спутник всё равно погибает. Это «уничтожение» — срабатывает [[c:sh-h-15|Горе и страдания]].</p>`);

E('removal','Уничтожение и удаление','Охота','удаление уничтожение потеря',`<p>«Потеря/уничтожение» возможны только в Охоте и через карты. «Удаление» — например, отделение на шкале Мордора. Хоббит-проводник, отделившийся по способности, — не уничтожен. Хоббит, выбранный случайной потерей и спасшийся «Взять их живьём!», — уничтожен. Важно для [[c:sh-h-15|Горя и страданий]].</p>`);

E('hunt-pool','Запас Охоты','Охота','запас жетоны обычные особые',`
<p>16 обычных (бежевых) жетонов в непрозрачной ёмкости. Если жетоны кончились — верните обычные вытянутые, кроме удалённых навсегда; особые не возвращаются. Если опустошение временное и жетон вернётся в этом же действии ([[c:fp-h-5|Мифриловая кольчуга]], [[c:fp-h-14|Испытание короля]]), запас не восстанавливают, пока жетон действительно нужен.</p>
<p>Особые жетоны активируются картами и откладываются до входа в Мордор; если карта сыграна в Мордоре — сразу в запас. СН: Эльфийские плащи 0, Эльфийская верёвка 0, Фиал −2, Смеагол −1. Тьма: Логово Шелоб (кубик, стоп), Моя прелесть! (Око, раскрыть, стоп), Туда! Они пошли туда! (3, стоп), Отдайте его нам! (1, раскрыть, стоп). Особые жетоны вытягиваются только на шкале Мордора; вытянутые картами Патруль орков, Проклятье Исилдура, Тварь из бездны, Раскол Братства жетоны СН и «Око» сбрасываются без эффекта.</p>`);

E('mordor','Мордор','Охота','мордор шкала мордора роковая гора',`
<ul>
<li>Вход: в фазу Братства из Мораннона или Минас Моргула (можно сперва объявить, чтобы туда попасть). Объявлять не обязательно, можно даже раскрытым.</li>
<li>Миниатюра — на первое деление шкалы Мордора (не регион Горгорот). Прогресс больше не растёт, но «спрятано/раскрыто» отслеживается.</li>
<li>Новый запас Охоты: оставшиеся + все вытянутые «Око» (кроме удалённых навсегда) + активированные особые жетоны.</li>
<li>Движение — без броска: сразу тянется жетон. «Око» = кубики в ячейке Охоты (вкл. кубики СН). «Стоп» — Братство остаётся на месте.</li>
<li>Спутники не могут покинуть Братство — эффекты отделения удаляют их.</li>
<li>Если за фазу действий не было попытки двигаться или спрятаться — влияние +1.</li>
<li>Пройдены 5 делений (Расщелина Судьбы) при влиянии &lt;12 — победа СН.</li>
<li>Неприменимы: [[c:sh-h-9|Поиски Кольца]], [[c:sh-h-10|Безжалостная погода]], [[c:sh-h-11|Удар назгулов!]]; [[c:sh-h-16|Стаи воронов]] — без эффекта.</li>
</ul>`);

/* ---------- Политика ---------- */
E('politics','Шкала политики','Политика','политика шкала дипломатия',`<p>Старт: Рохан, северяне, эльфы, гномы — 1-е деление (все пассивны, кроме эльфов); Гондор, харадримы/истерлинги — 2-е; Саурон, Изенгард — 3-е (за шаг до войны). Народы Тьмы и эльфы активны. Пассивный народ не может перейти на «в войне». См. [[activation]], [[advance]], [[at-war]].</p>`);

E('activation','Активация народов СН','Политика','активация активный пассивный',`
<ul>
<li>В регион народа входит вражеское войско (любое передвижение, включая картами).</li>
<li>Атаковано войско с отрядами этого народа.</li>
<li>Братство объявлено в большом городе/крепости народа (незахваченных).</li>
<li>Спутник с символом народа заканчивает передвижение (действием) или входит в игру в его незахваченном большом городе/крепости. Отступление — не передвижение. Странник — не может, Арагорн/Гэндальф/хоббиты — любой народ.</li>
<li>Король-чародей при входе активирует все СН.</li>
</ul>
<p>[[c:sh-h-22|Гнилоуст]] ограничивает активацию Рохана.</p>`);

E('advance','Продвижение по шкале','Политика','продвижение сдвиг',`
<p>+1 деление: кубик «Сбор» (дипломатия, только своего народа, пассивный не дойдёт до «в войне»); карты; автоматически — каждый раз, когда атаковано войско с отрядами народа (1 раз за битву); когда захвачено поселение народа.</p>
<p>Пример: атака на Дейл, северяне отступили, город захвачен — северяне активны и сдвигаются на 2 деления.</p>`);

E('at-war','«В войне» и невоюющие народы','Политика','в войне невоюющий',`
<p><b>Невоюющие:</b> не пересекают границы других народов (даже дружественных); не атакуют (защищаться могут); не нанимаются кубиком «Сбор» (картами — можно). Ограничения действуют и в смешанном войске. Исключение — отступление: потом при следующем передвижении обязаны покинуть чужие земли.</p>
<p><b>«В войне»:</b> все ограничения сняты.</p>`);

/* ---------- Победа ---------- */
E('victory','Условия победы','Победа','победа очки военная кольцо',`
<ol>
<li>Влияние Кольца 12 — победа Тьмы (мгновенно).</li>

['fp-h-10','fp','h','char',10,'Есть и другой путь','','Передвиньте или спрячьте Братство; понизьте влияние Кольца на 1.','heroicdeath',['Движение картой — кубик розыгрыша в ячейку Охоты не кладётся; Охота проводится.','Можно только понизить влияние, пропустив «спрятать/передвинуть». Можно при влиянии 0.']],
['fp-h-11','fp','h','char',11,'Я пойду один','Хотя бы 1 спутник в Братстве','Отделите спутника или группу (дистанция ≤ прогресс + высший уровень + 1); понизьте влияние Кольца.','challenge',['Нельзя, если проводник Голлум. Не двигает уже отделённых.','Группа идёт вместе, без подбора/оставления. В осаждённую крепость с войском СН входить нельзя; в регионе с крепостью Тьмы — стоп.','В осаждённой крепости Хранителей — остаются в крепости.','В Мордоре — спутник удаляется (влияние снижается).']],
['fp-h-12','fp','h','char',12,'Песнь Бильбо','','Понизьте влияние Кольца (см. карту).','fateful',['Можно при влиянии 0 или 1; не ниже 0.']],
['fp-h-13','fp','h','char',13,'Зеркало Галадриэли','Братство в Лориэне — для второй части','Поменяйте один кубик «Персонаж» на «Волю Запада». Если Братство в Лориэне — влияние −1.','heroicdeath',['Если есть «Персонаж» — менять обязательно; если нет — можно разыграть.','Эльфийским кольцом можно сделать «Персонаж» и затем поменять.','Лориэн осаждён — можно, захвачен — нет. Важно положение миниатюры.']],
['fp-h-14','fp','h','char',14,'Испытание короля','Странник/Арагорн с войском СН в регионе Рохана или Гондора','Вытяните 3 жетона Охоты: жетоны с «Оком» удаляются из игры, остальные возвращаются без эффекта; если все 3 — «Око», Странник/Арагорн уничтожен (жетоны возвращаются).','sudden',['Осгилиат — не регион Гондора.','«Моя прелесть!» (в Мордоре) тоже «Око».','Запас не восстанавливать, если жетоны вернутся в этом действии.','Удалённые «Око» не возвращаются при входе в Мордор.']],
['fp-h-15','fp','h','char',15,'Гвайхир Повелитель Ветров','','Отделите спутника/группу (≤ прогресс + 4) или передвиньте отделённого/группу (≤4).','challenge',['Уровень и «Серогрив» не учитываются. Чёрные границы не пересекать.','Можно войти (не выйти) в дружественную осаждённую крепость.','В Мордоре отделение = удаление (можно ради Голлума).']],
['fp-h-16','fp','h','char',16,'Лёгкая поступь','','Отделите (≤ прогресс + уровень + 2) или передвиньте спутника/группу (≤ уровень + 2).','challenge',['«Серогрив» даёт уровень 4.','Можно войти в дружественную осаждённую крепость.','Гэндальф Серый отделился этим действием — карты за проводника нет.']],
['fp-h-17','fp','h','char',17,'Туда и обратно','','Отделите спутника/группу (≤ прогресс + уровень + 1). Если Гимли/Леголас в Дейле, Эреборе или Лесном Королевстве — активация и продвижение народа (см. карту).','holdline',['Отделить обязательно, если возможно (кроме Голлума-проводника).','Гимли/Леголас могли стоять там заранее. Не в захваченном регионе.','Не сбрасывает «Угрозы и обещания».']],
['fp-h-18','fp','h','char',18,'Орлы приближаются!','См. карту','Бросьте кубики за назгулов в регионе; попадания уничтожают их, выжившие Тьма переносит в незахваченную крепость Саурона.','heroicdeath',['Король-чародей — не назгул для этой карты.','Не атака, на политику не влияет.','Переносить в другую крепость; можно в осаждённую СН (не захваченную).']],
['fp-h-19','fp','h','char',19,'Энты пробуждаются: Древобород','Гэндальф Белый в игре и спутник в Фангорне (может быть сам Гэндальф Белый)','Атакует Ортханк (см. карту). Если Гэндальф Белый в Фангорне/Рохане — можно сыграть ещё одну героическую карту.','entrage',['Нет войска Тьмы в Ортханке — уничтожается только Саруман.','Есть войско — это атака (политика); уничтожение войска уничтожает назгулов и прислужников.','Можно против войска в осаде и осаждающего. Уничтожены осаждённые — СН захватывает Ортханк.','Цепочка до 4 карт: три «Энты» + ещё одна героическая.']],
['fp-h-20','fp','h','char',20,'Энты пробуждаются: хуорны','Гэндальф Белый в игре и спутник в Фангорне (может быть сам Гэндальф Белый)','Как «Древобород», другой эффект атаки (см. карту).','huorns',['См. «Древобород».']],
['fp-h-21','fp','h','char',21,'Энты пробуждаются: сбор энтов','Гэндальф Белый в игре и спутник в Фангорне (может быть сам Гэндальф Белый)','Как «Древобород», другой эффект атаки (см. карту).','nameless',['См. «Древобород».']],
['fp-h-22','fp','h','char',22,'Мертвецы Дунхарга','Странник/Арагорн в регионе Рохана','Передвиньте Странника/Арагорна (и спутников с ним) в Эрех, Ламедон или Пеларгир; атакуйте войско Тьмы там, затем наймите отряды Гондора (см. карту).','sudden',['Можно из осаждённой Хельмовой пади. Фангорн и Ортханк — не Рохан.','Атака влияет на политику; войско Тьмы после броска обязано отступить, иначе уничтожается.','Можно нанимать в захваченном поселении, но контроль СН не получает.']],
['fp-h-23','fp','h','char',23,'Дом наместников','Боромир в регионе Гондора','Наймите отряды Гондора в регионе Боромира (см. карту); возьмите 2 стратегические карты.','holdline',['Осгилиат — не Гондор. Регион должен быть свободен; в захваченном поселении — нельзя.','Можно в осаждённой крепости и с войском, осаждающим захваченную крепость.','Можно сыграть ради 2 карт. Лимит: см. справку «Лимит руки».']],

['sh-h-7','sh','h','char',7,'Тварь из бездны','Братство не в поселении СН','Вытяните жетон; если без «Ока» — правила успешной Охоты (урон можно снижать обычными способами, в том числе потерей случайного спутника).','dreadful',['Потеря случайного спутника — один из способов снизить урон, не обязанность. Порядок: карта со стола → способности проводника → случайная потеря (если Голлум не проводник) → остаток во влияние.','Случайная потеря — «уничтожение»: срабатывает «Горе и страдания».']],

у боевого броска.", "advance": "До боевого броска можете нанести своему войску до 2 попаданий. +1 к каждому кубику боевого броска за каждое такое попадание.", "greathost": "Если после потерь от боевого броска и переброса у вас осталось хотя бы вдвое больше отрядов, чем у противника, нанесите ему одно попадание.", "mumakil": "Разыграйте, если в бою участвует элитный отряд харадримов/истерлингов. +1 к каждому кубику боевого броска. Если после переброса за лидерство вы нанесли больше попаданий, чем противник (включая дополнительные атаки Свободных народов до боевого броска с боевых карт), нанесите ещё одно попадание.", "bats": "Отмените боевую карту Свободных народов. Если Свободные народы не сыграли боевую карту, +1 к каждому кубику вашего переброса за лидерство.", "wecome": "Разыграйте, если в бою участвует элитный отряд Тьмы. После того как убраны потери от боевого броска и переброса, проведите дополнительную атаку: по кубику за каждый элитный отряд Тьмы (не более 5), каждая «5» и выше — попадание.", "fierce": "+1 к каждому кубику боевого броска и переброса за лидерство обоих войск.", "onefordark": "Разыграйте, если ваше защищающееся войско находится в одном регионе с Братством. +1 к каждому кубику вашего боевого броска и переброса за лидерство.", "relentless": "Разыграйте, если общее лидерство назгулов в бою 2 или более. Откажитесь от 2 очков лидерства назгулов, чтобы добавить 1 к значению ваших кубиков во время боевого броска.", "dreadful": "Разыграйте, если общее лидерство назгулов в бою 1 или более. Откажитесь от 1 лидерства назгулов, чтобы получить +1 к каждому кубику переброса за лидерство.", "dread": "Разыграйте, если общее лидерство назгулов в бою 1 или более. До боевого броска откажитесь от 1 или более лидерства назгулов: боевая сила Свободных народов снижается на столько же (но не меньше 1 кубика).", "stench": "Разыграйте, если общее лидерство назгулов в бою 1 или более. Если оно не меньше общего лидерства Свободных народов, переброс за лидерство Свободных народов отменяется.", "breath": "Разыграйте, если назгул участвует в битве. Если ваш переброс за лидерство приносит хотя бы 1 попадание, можете дополнительно сделать одно из двух: уничтожить 1 лидера Свободных народов, участвующего в битве, или уничтожить спутника, участвующего в битве, если количество попаданий равно его уровню или превышает его.", "words": "Разыграйте, если в бою участвует назгул. Выберите спутника: в этом раунде его лидерство и способности не действуют.", "durin": "Разыграйте, если ваше защищающееся войско находится не дальше 2 регионов от Мории. До боевого броска проведите дополнительную атаку тремя кубиками: каждая «4» и выше — попадание, применяется сразу."};

const CARD_TXT = {"fp-s-1": "Разыграйте и выложите на стол, если Арагорн находится с войском Свободных народов и это войско вне границ народов Свободных народов. Пока карта на столе, кубик, которым передвигали Братство, не кладётся в ячейку Охоты. Сбросьте карту, если Братство объявлено или раскрыто.", "fp-s-2": "Выложите на стол. Продвиньте эльфов на 1 деление по шкале политики. Пока карта на столе, войска Тьмы не могут входить в Лориэн, Ривенделл и Серые Гавани и атаковать их (полевым боем или штурмом). Тьма может сбросить карту, потратив любой кубик действия и сбросив с руки одну героическую и одну стратегическую карту.", "fp-s-3": "Выложите на стол. Продвиньте северян на 1 деление по шкале политики. Пока карта на столе, войска Тьмы не могут входить в Шир, Бакленд и Старый лес и атаковать их (полевым боем или штурмом). Тьма может сбросить карту, потратив любой кубик действия и сбросив с руки одну героическую и одну стратегическую карту.", "fp-s-4": "Передвиньте одного или всех спутников, не находящихся в Братстве. Затем, если какой-либо спутник находится в Эреборе или Эред Луине, активируйте гномов и переведите их сразу в положение «в войне».", "fp-s-5": "Выберите войско Тьмы, в котором есть отряды хотя бы двух разных народов Тьмы. Бросьте 5 кубиков: каждая «5» и выше — попадание по этому войску.", "fp-s-6": "Выберите войско Тьмы в Осгилиате, Южном или Северном Итилиене. Бросьте 3 кубика: каждая «5» и выше — попадание по этому войску. Затем, если в Осгилиате войско Свободных народов, наймите туда один отряд Гондора (обычный или элитный) и одного лидера Гондора.", "fp-s-7": "Передвиньте одного или всех спутников, не находящихся в Братстве. Затем, если какой-либо спутник находится в Шире или Бри, активируйте северян и переведите их сразу в положение «в войне».", "fp-s-8": "Активируйте любой народ Свободных народов и продвиньте его на 1 деление по шкале политики.", "fp-s-9": "Разыграйте, если Гондор активен. Продвиньте Рохан на 1 деление по шкале политики. Затем наймите в Эдорасе один отряд Рохана (обычный или элитный) и одного лидера Рохана.", "fp-s-10": "Атакуйте из соседнего региона войско Тьмы, осаждающее крепость с войском Свободных народов. Всю эту битву боевая сила Тьмы снижена на 1 за каждый отряд Свободных народов в осаждённой крепости (но не меньше 1 кубика).", "fp-s-11": "Разыграйте, если Рохан «в войне». Передвиньте войско Свободных народов из любого региона Рохана (в том числе из осаждённой крепости) прямо в Минас Тирит. Если Минас Тирит осаждён или занят Тьмой — в соседний с ним регион. Регион назначения должен быть доступен для передвижения войска.", "fp-s-12": "Разыграйте, если спутник находится с войском Свободных народов. Передвиньте это войско на расстояние до 2 регионов (регионы должны быть доступны для передвижения). По пути войско не может подбирать или оставлять отряды (но его можно разделить перед движением).", "fp-s-13": "Разыграйте, если эльфы «в войне». Наймите два отряда эльфов (обычных или элитных) в приморском регионе с войском Свободных народов.", "fp-s-14": "Наймите в Минас Тирите один отряд Гондора (обычный или элитный) и одного лидера Гондора.", "fp-s-15": "Наймите в Лориэне один отряд эльфов (обычный или элитный). Затем возьмите стратегическую карту.", "fp-s-16": "Наймите один отряд Рохана (обычный или элитный) и одного лидера Рохана в Эдорасе или в любом регионе Рохана, где находится спутник.", "fp-s-17": "Наймите в Карроке один отряд северян (обычный или элитный) и одного лидера северян.", "fp-s-18": "Наймите в Дол Амроте один отряд Гондора (обычный или элитный) и одного лидера Гондора.", "fp-s-19": "Наймите в Дейле два обычных отряда северян. Затем возьмите стратегическую карту.", "fp-s-20": "Наймите один отряд северян (обычный или элитный) в Шире и один отряд гномов (обычный или элитный) в Эред Луине. Затем возьмите стратегическую карту.", "fp-s-21": "Наймите в Ривенделле один отряд эльфов (обычный или элитный). Затем возьмите стратегическую карту.", "fp-s-22": "Наймите в Эреборе один отряд гномов (обычный или элитный) и одного лидера гномов.", "fp-s-23": "Наймите один отряд Рохана (обычный или элитный) и одного лидера Рохана в любом свободном регионе Рохана с поселением.", "fp-s-24": "Наймите в Лесном Королевстве один отряд эльфов (обычный или элитный). Затем возьмите стратегическую карту.", "fp-h-1": "Особый жетон «Эльфийские плащи» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "fp-h-2": "Особый жетон «Эльфийская верёвка» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "fp-h-3": "Особый жетон «Фиал Галадриэли» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "fp-h-4": "Особый жетон «Смеагол помогает доброму хозяину» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "fp-h-5": "Выложите на стол. После того как Тьма вытянула жетон Охоты, можете сбросить эту карту, чтобы был вытянут второй жетон. Примените второй жетон вместо первого, а первый верните в запас Охоты.", "fp-h-6": "Разыграйте и выложите на стол, если Гимли или Леголас в Братстве. После того как Тьма вытянула жетон Охоты, можете сбросить эту карту, чтобы снизить урон Охоты на 1 (не ниже 0). Остаток урона применяется как обычно. Сбросьте карту, если Гимли и Леголас покинули Братство.", "fp-h-7": "Разыграйте и выложите на стол, если Боромир в Братстве. После того как Тьма вытянула жетон Охоты, можете сбросить эту карту, чтобы снизить урон Охоты на 1 (не ниже 0). Остаток урона применяется как обычно. Сбросьте карту, если Боромир покинул Братство.", "fp-h-8": "Разыграйте и выложите на стол, если Гэндальф Серый в Братстве. Можете сбросить эту карту, чтобы Тьма не тянула жетон Охоты. Сбросьте карту, если Гэндальф Серый покинул Братство.", "fp-h-9": "Бросьте 3 кубика: за каждую «5» и выше понизьте влияние Кольца на 1. Если проводник — Странник, понижайте за каждую «3» и выше.", "fp-h-10": "Понизьте влияние Кольца на 1. Затем, если проводник — Голлум, можете также спрятать или передвинуть Братство (по обычным правилам).", "fp-h-11": "Разыграйте, если в Братстве хотя бы один спутник. Отделите спутника (или группу); он может пройти на 1 регион дальше обычного. Затем понизьте влияние Кольца на 1.", "fp-h-12": "Понизьте влияние Кольца на 1. Если проводник — Голлум, понизьте на 2.", "fp-h-13": "Поменяйте 1 неиспользованный кубик действий Свободных народов с символом «Персонаж» на «Волю Запада». Если Братство в Лориэне и он не захвачен, также понизьте влияние Кольца на 1.", "fp-h-14": "Разыграйте, если Странник/Арагорн в регионе Рохана или Гондора вместе с войском Свободных народов. Вытяните 3 жетона Охоты. Если на всех изображено «Око», верните их в запас Охоты и уничтожьте Странника/Арагорна. Иначе удалите из игры вытянутые жетоны с «Оком», а остальные верните в запас Охоты, не применяя их эффект.", "fp-h-15": "Отделите спутника или группу от Братства либо передвиньте отделённого спутника или группу так, как если бы их уровень был 4. Передвижение может закончиться в осаждённой крепости.", "fp-h-16": "Отделите спутника или группу от Братства либо передвиньте отделённого спутника или группу; они могут пройти на 2 региона дальше обычного. Передвижение может закончиться в осаждённой крепости.", "fp-h-17": "Отделите спутника или группу от Братства либо передвиньте отделённого спутника или группу; они могут пройти на 1 регион дальше обычного. Если после этого Гимли или Леголас в Дейле, Эреборе или Лесном Королевстве — активируйте гномов и северян и продвиньте гномов, северян и эльфов на 1 деление по шкале политики.", "fp-h-18": "Разыграйте, если войско Свободных народов со спутником находится в одном регионе или в соседнем с войском Тьмы, в котором есть назгул. Бросьте по кубику за каждого назгула в этом войске (не более 5): каждая «5» и выше уничтожает одного назгула. Выжившие назгулы сразу перемещаются в любую крепость Саурона под контролем Тьмы. Король-чародей для этой карты не считается назгулом.", "fp-h-19": "Разыграйте, если Гэндальф Белый в игре и спутник находится в Фангорне. Бросьте 3 кубика: каждая «4» и выше — попадание по войску Тьмы в Ортханке. Если оно уничтожено, уничтожьте также назгулов и прислужников вместе с ним. Если Саруман в Ортханке без войска — уничтожьте его. Если Гэндальф Белый в Фангорне или в регионе Рохана, можете сразу разыграть ещё одну героическую карту с руки, не тратя кубик действия.", "fp-h-20": "Разыграйте, если Гэндальф Белый в игре и спутник находится в Фангорне. Бросьте 3 кубика: каждая «4» и выше — попадание по войску Тьмы в Ортханке. Если оно уничтожено, уничтожьте также назгулов и прислужников вместе с ним. Если Саруман в Ортханке без войска — уничтожьте его. Если Гэндальф Белый в Фангорне или в регионе Рохана, можете сразу разыграть ещё одну героическую карту с руки, не тратя кубик действия.", "fp-h-21": "Разыграйте, если Гэндальф Белый в игре и спутник находится в Фангорне. Бросьте 3 кубика: каждая «4» и выше — попадание по войску Тьмы в Ортханке. Если оно уничтожено, уничтожьте также назгулов и прислужников вместе с ним. Если Саруман в Ортханке без войска — уничтожьте его. Если Гэндальф Белый в Фангорне или в регионе Рохана, можете сразу разыграть ещё одну героическую карту с руки, не тратя кубик действия.", "fp-h-22": "Разыграйте, если Странник/Арагорн в Рохане (в том числе в осаждённой крепости). Передвиньте его (и любых спутников из того же региона) в Эрех, Ламедон или Пеларгир. Если там войско Тьмы, бросьте один кубик: войско получает столько попаданий, сколько выпало, и должно сразу отступить; если не отступает — уничтожается полностью вместе с назгулами и прислужниками. Затем можете нанять в этом регионе три обычных отряда Гондора.", "fp-h-23": "Разыграйте, если Боромир в регионе Гондора. Наймите один отряд Гондора (обычный или элитный) в регионе Боромира. Затем возьмите 2 стратегические карты.", "fp-h-24": "Разыграйте, если Странник/Арагорн находится с войском Свободных народов. Уничтожьте в этом войске один обычный отряд и наймите на его место элитный того же народа. Затем возьмите 2 стратегические карты.", "sh-s-1": "Разыграйте, если вы контролируете хотя бы одну эльфийскую крепость. За каждую неосаждённую эльфийскую крепость бросьте столько кубиков, сколько там эльфийских отрядов (не более 5): каждая «6» — попадание по этому войску.", "sh-s-2": "Разыграйте, если Саруман в игре и войско с отрядами Изенгарда осаждает крепость Свободных народов. Сразу проведите штурм этой крепости. Битва длится 3 раунда вместо одного. В первом раунде Свободные народы не могут играть боевые карты, если в крепости нет спутника.", "sh-s-3": "Разыграйте и выложите на стол, если Минас Тирит осаждён. При розыгрыше уничтожьте одного лидера Свободных народов в Минас Тирите. Пока карта на столе, Свободные народы не могут играть боевые карты в битвах за Минас Тирит. Свободные народы могут сбросить карту кубиком «Воля Запада» или любым кубиком, если в Минас Тирите Арагорн или Гэндальф.", "sh-s-4": "Разыграйте, если все народы Тьмы «в войне». Отмените все неиспользованные кубики «Воля Запада» Свободных народов.", "sh-s-5": "Выложите на стол. Пока карта на столе, Свободные народы не могут продвигать невоюющий народ по шкале политики кубиком «Сбор». Карта сбрасывается, когда невоюющий народ Свободных народов продвигается по шкале из-за атаки или способности спутника.", "sh-s-6": "Разыграйте, если Братство или спутник находится внутри границ народа Свободных народов, который ещё не «в войне». Сдвиньте этот народ на 1 деление назад по шкале политики. Затем Свободные народы уничтожают одного лидера или один отряд (обычный или элитный) этого народа.", "sh-s-7": "Передвиньте одно войско Тьмы на расстояние до 3 регионов. Оно должно закончить движение в регионе с другим войском Тьмы (не осаждённым). Путь должен быть доступен для передвижения; по пути войско не подбирает и не оставляет отряды (но его можно разделить перед движением).", "sh-s-8": "Передвиньте два войска Тьмы на расстояние до 2 регионов каждое. Каждое должно закончить движение в регионе с другим войском Тьмы (не осаждённым). Путь должен быть доступен для передвижения; по пути войска не подбирают и не оставляют отряды (но их можно разделить перед движением).", "sh-s-9": "Разыграйте, если все народы Тьмы «в войне». Передвиньте до четырёх войск Тьмы в соседние регионы.", "sh-s-10": "Разыграйте, если харадримы/истерлинги «в войне». Передвиньте войско Тьмы из Умбара в любой приморский регион Гондора. Если там войско Свободных народов, сразу атакуйте его. Прекратить эту атаку нельзя, кроме штурма уже осаждённого войска.", "sh-s-11": "Разыграйте, если Изенгард «в войне». Наймите два обычных отряда Изенгарда в одном из регионов, соседних с Северным или Южным Дунландом. Можете передвинуть туда до четырёх отрядов Изенгарда (обычных или элитных) из Северного или Южного Дунланда.", "sh-s-12": "Разыграйте, если Король-чародей в игре. Передвиньте Короля-чародея в Ангмар и наймите там один элитный и два обычных отряда Саурона.", "sh-s-13": "Разыграйте, если Изенгард «в войне». Наймите один отряд Изенгарда (обычный или элитный) в регионе, где уже есть войско Тьмы.", "sh-s-14": "Разыграйте, если Саурон «в войне». Наймите один отряд Саурона (обычный или элитный) в регионе, где уже есть войско Тьмы.", "sh-s-15": "Разыграйте, если Саурон «в войне». Замените два обычных отряда Саурона в любом месте карты двумя элитными.", "sh-s-16": "Разыграйте, если Саруман в игре. Наймите по 2 обычных отряда Изенгарда в Северном и Южном Дунланде и два отряда Изенгарда (обычных или элитных) в Ортханке.", "sh-s-17": "Наймите по два отряда харадримов/истерлингов в трёх разных поселениях харадримов/истерлингов.", "sh-s-18": "Разыграйте, если Арагорн в игре. Наймите в Минас Моргуле 5 обычных отрядов Саурона и одного назгула.", "sh-s-19": "Наймите 2 отряда Саурона (обычных или элитных) и одного назгула на горе Грам или в Мории.", "sh-s-20": "Наймите три обычных отряда Саурона в Дол Гулдуре и три обычных отряда Саурона на горе Гундабад.", "sh-s-21": "Разыграйте, если харадримы/истерлинги «в войне». Наймите пять обычных отрядов харадримов/истерлингов в свободном регионе внутри их границ, примыкающем к восточному краю карты.", "sh-s-22": "Наймите по одному обычному отряду Саурона в Ангмаре, Эттенских пустошах (Ettenmoors) и на Ветреных холмах (Weather Hills) и один элитный отряд Саурона в Троллистой чаще (Trollshaws).", "sh-s-23": "Разыграйте, если все народы Тьмы «в войне». Наймите пять обычных отрядов харадримов/истерлингов в Горгороте и пять обычных отрядов Саурона в Нурне.", "sh-s-24": "Разыграйте, если Саурон «в войне». Наймите по два обычных отряда Саурона в трёх разных крепостях Саурона.", "sh-h-1": "Особый жетон «Логово Шелоб» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "sh-h-2": "Особый жетон «Моя прелесть!» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "sh-h-3": "Особый жетон «Туда! Они пошли туда!» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "sh-h-4": "Особый жетон «Отдайте его нам!» входит в игру. Он добавляется в запас Охоты, когда Братство находится в Мордоре.", "sh-h-5": "Разыграйте, если Братство находится не в регионе с поселением Свободных народов. Вытяните жетон Охоты. Если на нём «Око» или это особый жетон Братства, сбросьте его без эффекта. Иначе действуйте по правилам успешной Охоты.", "sh-h-6": "Разыграйте, если Братство находится не в регионе с поселением Свободных народов. Вытяните жетон Охоты. Если на нём «Око» или это особый жетон Братства, сбросьте его без эффекта. Иначе действуйте по правилам успешной Охоты, но урон Охоты ничем нельзя снизить — он целиком идёт во влияние Кольца.", "sh-h-7": "Разыграйте, если Братство находится не в регионе с поселением Свободных народов. Вытяните жетон Охоты. Если на нём «Око» или это особый жетон Братства, сбросьте его без эффекта. Иначе действуйте по правилам успешной Охоты. Урон Охоты можно снижать обычными способами, в том числе потерей случайного спутника (если в Братстве есть спутник).", "sh-h-8": "Разыграйте, если Братство находится не в регионе с поселением Свободных народов. Бросьте 3 кубика: за каждую «4» и выше повысьте влияние Кольца на 1. Если проводник — Голлум, повышайте только за каждую «6».", "sh-h-9": "Разыграйте, если прогресс Братства 1 или больше. Передвиньте одного или всех назгулов. Затем, если хотя бы один назгул находится в регионе Братства, Братство раскрыто.", "sh-h-10": "Разыграйте, если прогресс Братства 1 или больше. Передвиньте миниатюру Хранителей в соседний регион.", "sh-h-11": "Разыграйте, если Братство на делении 1 или дальше на шкале Братства. Передвиньте сколько угодно назгулов. Затем, если хотя бы 1 назгул в том же регионе, что и Братство, можете либо сбросить одну из героических карт Свободных народов, лежащую на столе, либо бросить кубики для Охоты (как если бы игрок за Свободные народы передвигал Братство).", "sh-h-12": "Разыграйте, если Братство раскрыто. Если влияние Кольца 3 или меньше, повысьте его на 2, иначе на 1.", "sh-h-13": "Разыграйте, если Братство раскрыто. Выберите случайного спутника в Братстве. Свободные народы должны либо повысить влияние Кольца на его уровень, либо уничтожить этого спутника. Если проводник — Голлум, вместо этого повысьте влияние Кольца на 1.", "sh-h-14": "Разыграйте, если Братство раскрыто. Вытяните жетон Охоты. Если на нём «Око» или это особый жетон — сбросьте без эффекта. Если на нём число — отделите столько же спутников (если возможно) и поместите их в регион Братства; если Братство в Мордоре, эти спутники уничтожаются. Символы «раскрыть» и «стоп» игнорируются. Если проводник — Голлум, вместо этого повысьте влияние Кольца на 1.", "sh-h-15": "Выложите на стол. Пока карта на столе, когда спутник покидает Братство, потому что уничтожен, сбросьте случайную героическую карту из руки Свободных народов или одну со стола. Сбросьте эту карту, если Братство объявлено в незахваченном большом городе или крепости Свободных народов.", "sh-h-16": "Выложите на стол. Перед броском Охоты можете сбросить эту карту: +1 к каждому кубику этого броска Охоты, включая перебросы. Сбросьте эту карту, если Братство объявлено в незахваченном большом городе или крепости Свободных народов.", "sh-h-17": "Выложите на стол. Если Братство из-за объявления или раскрытия выходит из Мории, проходит через неё или входит в неё, вытяните жетон Охоты. Если на нём «Око» — сбросьте без эффекта, иначе действуйте по правилам успешной Охоты. Символ «раскрыть» игнорируется, если Братство объявлено в большом городе или крепости Свободных народов. Также можете сбросить эту карту, чтобы сыграть её как боевую карту, будто с руки.", "sh-h-18": "Переверните три своих неиспользованных кубика действий на «Око» и сразу положите их в ячейку Охоты.", "sh-h-19": "Разыграйте, если войско Тьмы с назгулом находится в одном регионе или в соседнем с войском Свободных народов. Бросьте по кубику за каждого назгула в этом войске (не более 5): каждая «5» и выше — попадание по войску Свободных народов.", "sh-h-20": "Разыграйте, если Король-чародей в игре и войско Тьмы осаждает крепость. Проведите штурм этой крепости. Битва длится 3 раунда вместо одного. Если в бою не участвует спутник, Свободные народы не могут играть боевые карты в первом раунде.", "sh-h-21": "Разыграйте и выложите на стол, если Саруман в игре. Пока карта на столе, после розыгрыша карты события кубиком «Событие» сразу возьмите карту из любой своей колоды. Свободные народы могут сбросить эту карту кубиком «Воля Запада» или любым кубиком вместе с эльфийским кольцом. Сбросьте карту, если Саруман уничтожен.", "sh-h-22": "Разыграйте и выложите на стол, если Саруман в игре. Пока карта на столе, Рохан активируется только способностью спутника, объявлением Братства в Эдорасе или Хельмовой пади или атакой на Эдорас или Хельмову падь. Сбросьте карту, если Рохан активирован или Саруман уничтожен.", "sh-h-23": "Передвиньте одного или всех назгулов. Затем можете передвинуть любые два войска Тьмы с назгулом или атаковать одним войском с назгулом.", "sh-h-24": "Разыграйте, если Король-чародей в игре. Либо наймите двух назгулов в регионе Короля-чародея, либо передвиньте одного или всех назгулов. Затем можете передвинуть войско с Королём-чародеем или атаковать им."};

ира", 1, 1, "hobbits", [["Проводник", "Если урон Охоты 1 или больше, Перегрин может покинуть Братство, чтобы снизить урон на 1."], ["Взять их живьём!", "Если Перегрин уничтожен, находясь в Братстве, сразу верните его в игру, как если бы он отделился от Братства. Не действует, если Братство в Мордоре."]]], ["p-merry", "fp", 7, "Мериадок", "хоббит из Шира", 1, 1, "hobbits", [["Проводник", "Если урон Охоты 1 или больше, Мериадок может покинуть Братство, чтобы снизить урон на 1."], ["Взять их живьём!", "Если Мериадок уничтожен, находясь в Братстве, сразу верните его в игру, как если бы он отделился от Братства. Не действует, если Братство в Мордоре."]]], ["p-gandalf-white", "fp", 8, "Гэндальф Белый", "Посланник Запада", 3, 1, "gandalf-white", [["Ввод в игру", "Если Гэндальф Серый уничтожен или покинул Братство и хотя бы один прислужник в игре (или был в игре), можете кубиком «Воля Запада» ввести Гэндальфа Белого. Если Гэндальф Серый на карте — замените его; иначе поставьте Гэндальфа Белого в Фангорн или в эльфийскую крепость под контролем Свободных народов (даже осаждённую)."], ["Серогрив", "Если Гэндальф Белый двигается один или с одним хоббитом, его уровень считается равным 4 (только для передвижения)."], ["Белый Всадник", "Если Гэндальф Белый участвует в битве, в её начале можете отказаться от его лидерства, чтобы на всю битву отменить лидерство всех назгулов в бою (включая Короля-чародея)."]]], ["p-aragorn", "fp", 9, "Арагорн", "Наследник Исилдура", 3, 2, "strider", [["Ввод в игру", "Если Странник в Минас Тирите, Дол Амроте или Пеларгире и это поселение под контролем Свободных народов (даже если крепость осаждена), можете кубиком «Воля Запада» заменить Странника Арагорном."], ["Предводитель Запада", "Если Арагорн участвует в битве, +1 к боевой силе войска Свободных народов (не более 5 кубиков)."]]], ["p-gollum", "fp", 10, "Голлум", "раб Кольца", 0, 0, "gollum", [["Ввод в игру", "Когда последний спутник покидает Братство, сразу добавьте Голлума в Братство — он становится проводником."], ["Проводник", "Символ «раскрыть» на обычных числовых жетонах Охоты не раскрывает Братство. Если Братство не раскрыто Охотой, можете раскрыть его, чтобы снизить урон Охоты на 1."]]], ["p-ringbearers", "fp", 11, "Хранители Кольца", "Фродо и Сэм", null, null, "fellowship", [["Хранители", "Когда последний спутник покидает Братство, сразу добавьте Голлума в Братство — он становится проводником."]]], ["p-saruman", "sh", 1, "Саруман", "маг-отступник", null, 1, "saruman", [["Ввод в игру", "Если Изенгард «в войне» и Ортханк под контролем Тьмы (даже осаждённый), можете кубиком «Сбор» поставить Сарумана в Ортханк. Саруман не может покинуть Ортханк."], ["Голос Сарумана", "Пока Ортханк под вашим контролем и не осаждён, можете кубиком «Сбор» нанять по одному обычному отряду Изенгарда в каждом поселении Изенгарда или заменить два обычных отряда Изенгарда в Ортханке двумя элитными."], ["Слуги Белой Длани", "Каждый элитный отряд Изенгарда считается одновременно и отрядом, и лидером при передвижении и в бою."]]], ["p-mouth", "sh", 2, "Голос Саурона", "глашатай Барад-дура", 3, 2, "mouth", [["Ввод в игру", "Если Братство в Мордоре или все народы Свободных народов «в войне», можете кубиком «Сбор» поставить Голос Саурона в любой регион с крепостью Саурона под контролем Тьмы (даже осаждённой)."], ["Посланник Чёрной Башни", "Раз за ход можете использовать кубик «Сбор» как кубик «Войско»."]]], ["p-witch-king", "sh", 3, "Король-чародей", "предводитель назгулов", "∞", 2, "witch-king", [["Ввод в игру", "Если Саурон и хотя бы один народ Свободных народов «в войне», можете кубиком «Сбор» поставить Короля-чародея в любой регион с войском Тьмы, в котором есть хотя бы один отряд Саурона."], ["Колдун", "Если Король-чародей участвует в битве и вы сыграли боевую карту в первом раунде, можете сразу взять карту из колоды того же типа, что и сыгранная."]]]].map(r=>({id:r[0],side:r[1],num:r[2],name:r[3],sub:r[4],lvl:r[5],lead:r[6],ent:r[7],ab:r[8]}));
