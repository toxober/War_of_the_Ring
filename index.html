const DIE_NAMES={will:'Воля Запада',char:'Персонаж',muster:'Сбор',army:'Войско',event:'Событие',eye:'Око'};
const DIE_KEY={'muster+army':'combo'};
const die=(side,key)=>`<img class="die ${side}${key.includes('+')?' two':''}" src="${DIE_IMG[side+'_'+(DIE_KEY[key]||key)]}" alt="${key.split('+').map(k=>DIE_NAMES[k]).join(' / ')}" width="84" height="84">`;
const typeIcon=(side,type)=>`<img class="di" src="${DIE_IMG[side+'_'+type]}" alt="" title="${TYPE[type]}">`;

// ================= Ссылки =================
function linkify(html){
 return html.replace(/\[\[(c:)?([\w-]+)(?:\|([^\]]+))?\]\]/g,(m,isC,id,txt)=>{
  if(isC){ const c=CARD[id]; if(!c) return txt||id; return `<a class="cl-${c.side}" href="#c/${id}">${txt||c.name}</a>`; }
  const e=ENT[id]; if(!e) return txt||id; return `<a href="#r/${id}">${txt||e.t}</a>`;
 });
}
const BACK = {}; // backlinks
for(const e of Object.values(ENT)){ for(const m of e.b.matchAll(/\[\[([\w-]+)/g)){ if(ENT[m[1]] && m[1]!==e.id){ (BACK[m[1]]=BACK[m[1]]||new Set()).add(e.id);} } }
const CARD_REFS = {}; // entity -> cards mentioned
for(const e of Object.values(ENT)){ CARD_REFS[e.id]=[...new Set([...e.b.matchAll(/\[\[c:([\w-]+)/g)].map(m=>m[1]))]; }

// ================= Поиск =================
const IDX = [];
for(const e of Object.values(ENT)) IDX.push({k:'Правило · '+e.g, t:e.t, s:(e.t+' '+e.tags).toLowerCase(), h:'#r/'+e.id, body:e.b.replace(/<[^>]+>|\[\[|\]\]/g,' ').toLowerCase()});
for(const c of CARDS){ const cb=COMBAT[c.cb]; IDX.push({k:`Карта · ${c.side==='fp'?'СН':'Тьма'}, ${DECK[c.deck]} · бой: ${cb.n}`, t:c.name, s:(c.name+' '+cb.n).toLowerCase(), h:'#c/'+c.id, body:(c.ev+' '+c.notes.join(' ')+' '+cb.txt+' '+c.txt+' '+c.cbtxt).toLowerCase()}); }
for(const p of PERS){ IDX.push({k:`Карта персонажа · ${p.side==='fp'?'СН':'Тьма'}`, t:p.name, s:(p.name+' '+p.sub+' '+p.ab.map(a=>a[0]).join(' ')).toLowerCase(), h:'#p/'+p.id, body:p.ab.map(a=>a[1]).join(' ').toLowerCase()}); }
for(const [k,cb] of Object.entries(COMBAT)){ const first=CARDS.find(c=>c.cb===k); IDX.push({k:'Боевой эффект · инициатива '+cb.init, t:cb.n, s:cb.n.toLowerCase(), h:'#c/'+first.id, body:cb.txt.toLowerCase()}); }
function search(q){

const FP_CHARS = [ // id, имя, лидерство
 ['gg','Гэндальф Серый',1],['gw','Гэндальф Белый',1],['st','Странник',1],['ar','Арагорн',2],['bo','Боромир',1],['le','Леголас',1],['gi','Гимли',1],['me','Мериадок',1],['pi','Перегрин',1]];
function defBattle(){ return {att:'sh',type:'field',round:1,
 fp:{reg:1,eli:2,lead:1,ch:{gg:true},whiteRider:false,mod:0,rmod:0,dmod:0,cap:5},
 sh:{reg:9,eli:1,naz:5,wk:true,sar:false,mouth:false,sarInPlay:false,iseEli:0,harad:false,isen:false,mod:0,rmod:0,dmod:0,cap:5},
 flags:{fpBorders:false,rohan:false,moria:false,fs:false}}; }
function battleCalc(B){
 const fpAtt=B.att==='fp';
 const comp=FP_CHARS.filter(c=>B.fp.ch[c[0]]);
 const gandalf=B.fp.ch.gg||B.fp.ch.gw;
 const wr=B.fp.ch.gw&&B.fp.whiteRider;
 const nazLead=wr?0:(B.sh.naz+(B.sh.wk?2:0));
 const fpLeadRaw=B.fp.lead+comp.reduce((s,c)=>s+((c[0]==='gw'&&wr)?0:c[2]),0);
 const shLeadRaw=nazLead+(B.sh.sar?1:0)+(B.sh.mouth?2:0)+(B.sh.sarInPlay?B.sh.iseEli:0);
 const fpStr=B.fp.reg+B.fp.eli, shStr=B.sh.reg+B.sh.eli;
 const thr=(isAtt)=>{ if(!isAtt) return 5; if(B.type==='assault') return 6; if((B.type==='city'||B.type==='fortress')&&B.round===1) return 6; return 5; };
 const mk=(side,str,bonus,leadRaw,isAtt)=>{ const P=B[side];
  const dice=Math.max(0,Math.min(5,P.cap,str+bonus+P.dmod)); const lead=Math.max(0,Math.min(5,leadRaw)); const t=thr(isAtt);
  return {side,str,dice,lead,thr:t,p:pHit(t,P.mod),pr:pHit(t,P.mod+P.rmod),bonus}; };
 const fp=mk('fp',fpStr,(gandalf&&B.fp.ch.gg)?1:0,fpLeadRaw,fpAtt);
 const sh=mk('sh',shStr,0,shLeadRaw,!fpAtt);
 if(fpStr===0) fp.dice=0; if(shStr===0) sh.dice=0;
 for(const r of [fp,sh]) r.dist=dist(r.dice,r.lead,r.p,r.pr);
 fp.need=B.sh.reg+2*B.sh.eli; sh.need=B.fp.reg+2*B.fp.eli;
 return {fp,sh,comp,gandalf,wr,nazLead,fpLeadRaw,shLeadRaw};
}
function pHit(thr,mod){ let n=1; for(let f=2;f<=5;f++) if(f+mod>=thr) n++; return n/6; }
function binom(n,p){ const a=[]; for(let k=0;k<=n;k++){ let c=1; for(let i=0;i<k;i++) c=c*(n-i)/(i+1); a.push(c*Math.pow(p,k)*Math.pow(1-p,n-k)); } return a; }
function dist(n,lead,p,pr){ const out=new Array(n+1).fill(0); const b=binom(n,p);
 for(let k=0;k<=n;k++){ const r=Math.min(n-k,lead); const b2=binom(r,pr); for(let j=0;j<=r;j++) out[k+j]+=b[k]*b2[j]; } return out; }
const pct=x=>(x*100).toFixed(x<0.1&&x>0?1:0)+'%';
function cardConds(B,R){
 const fpDef=B.att==='sh'; const comp=R.comp.length; const hobbit=B.fp.ch.me||B.fp.ch.pi;
 const field=B.type!=='assault'&&B.type!=='sortie';
 const nazIn=B.sh.naz>0||B.sh.wk;
 const fpUnits=B.fp.reg+B.fp.eli, shUnits=B.sh.reg+B.sh.eli;
 const y=(v,why)=>({v,why});
 return {
  anduril:y(!!(B.fp.ch.st||B.fp.ch.ar),'Странник/Арагорн'), nameless:y(B.flags.rohan,'Рохан/Фангорн/Ортханк'), huorns:y(B.flags.rohan,'Рохан/Фангорн/Ортханк'), entrage:y(B.flags.rohan,'Рохан/Фангорн/Ортханк'),
  noquarter:y(null,'условие — на карте'), sudden:y(R.fpLeadRaw>0,'нужно лидерство'), vantage:y(B.flags.fpBorders,'защита в границах СН'),
  charge:y(B.fp.eli>0,'элитные СН'), heroicdeath:y(B.fp.lead+comp>0,'лидер или спутник'), holdline:y(comp>0,'спутники: '+comp), daylight:y(true,'без условий'),
  valour:y(B.fp.eli>0,'элитные СН'), confusion:y(true,'без условий'), westernesse:y(!!hobbit,'хоббит в бою'), mighty:y(comp>0,'спутник в бою'),

 document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>{ if(b.dataset.v==='deck') delete S.cards[b.dataset.cs]; else S.cards[b.dataset.cs]=b.dataset.v; save(); const y=scrollY; renderGame(); scrollTo(0,y); });
 document.querySelectorAll('[data-me]').forEach(b=>b.onclick=()=>{S.me=b.dataset.me;save();renderGame();});
 $('#newGame').onclick=()=>{ if(confirm('Начать новую партию? Отметки карт, состояние и жетоны Охоты будут сброшены.')){ const me=S.me; const keep=S.cardFilter; S=defaultState(); S.me=me; S.cardFilter=keep; save(); renderGame(); } };
}

// ================= Охота =================
function renderHunt(){
 const H=S.hunt; const G=S.game;
 const inPool=[]; HUNT_STD.forEach((t,i)=>{ if(H.std[i]==='pool') inPool.push({v:t[0],rev:t[1]}); });
 HUNT_SPECIAL.forEach(t=>{ if(H.sp[t.k]==='pool') inPool.push({v:t.v,rev:t.rev||0,stop:t.stop,sp:t.side}); });
 const n=inPool.length; const c=f=>inPool.filter(f).length;
 const stdLab={pool:'в запасе',drawn:'вытянут',removed:'удалён'};
 const spLab={off:'не в игре',aside:'отложен (до Мордора)',pool:'в запасе',drawn:'вытянут/сброшен'};
 const hb=S.huntCalc||(S.huntCalc={sh:1,fp:0,rr:0,ravens:false});
 const hp=k=>{ const need=Math.max(2,6-hb.fp-(hb.ravens?1:0)); return need>6?0:(7-need)/6; };
 const pS=hp(); const dice=Math.min(5,hb.sh); const rr=Math.min(3,hb.rr,dice);
 // распределение успехов с перебросами провалов
 const dd=dist(dice,rr,pS,pS); const pAny=1-dd[0]; const expS=dd.reduce((s,v,k)=>s+v*k,0);
 const numf=(k,v)=>`<span class="num"><button data-hd="${k}" data-d="-1">−</button><input data-hn="${k}" value="${v}" inputmode="numeric" aria-label="${k}"><button data-hd="${k}" data-d="1">+</button></span>`;
 const numeric=inPool.filter(t=>/^\d$/.test(t.v)); const avg=numeric.length?numeric.reduce((s,t)=>s+(+t.v),0)/numeric.length:0;
 $('#main').innerHTML=`<h1 class="sec" style="margin-top:0">Охота за Кольцом</h1>
 <p class="sub">Нажимайте на жетоны, чтобы менять их состояние. Состав обычных жетонов задан по памяти — сверьте со своей коробкой. Правила: ${linkify('[[hunt]], [[hunt-effects|порядок эффектов]], [[hunt-pool|запас]], [[mordor]]')}.</p>
 <div class="bt">
 <section class="side sh"><h2>Бросок Охоты</h2>
  <div class="row">Кубики Тьмы в ячейке ${numf('sh',hb.sh)}</div><div class="row">Кубики СН в ячейке (+1 каждый) ${numf('fp',hb.fp)}</div><div class="row">Перебросы (крепость / отряды / назгул) ${numf('rr',hb.rr)}</div>
  <div class="chk"><label><input type="checkbox" id="rav" ${hb.ravens?'checked':''}> сбросить «Стаи воронов» (+1)</label></div>
  <div class="stats"><div><div class="big">${pct(pAny)}</div><div class="lbl">шанс успешной Охоты</div></div><div><div class="big">${expS.toFixed(2)}</div><div class="lbl">ожид. успехов (урон «Ока»)</div></div><div><div class="big">${Math.max(2,6-hb.fp-(hb.ravens?1:0))}+</div><div class="lbl">успех на кубике</div></div></div>
  <div class="bars" style="margin-bottom:24px">${dd.map((v,k)=>`<div style="height:${Math.round(v*80)+1}px"><em>${pct(v)}</em><span>${k}</span></div>`).join('')}</div>
  <p class="note">Максимум 5 кубиков, до 3 перебросов промахов. В Мордоре броска нет — жетон тянется сразу, «Око» = все кубики в ячейке (${hb.sh+hb.fp}).</p></section>
 <section class="side"><h2>Запас сейчас: ${n} жетонов</h2>
  <div class="stats"><div><div class="big">${n?pct(c(t=>t.v==='Око')/n):'—'}</div><div class="lbl">«Око»</div></div><div><div class="big">${n?pct(c(t=>t.rev)/n):'—'}</div><div class="lbl">раскрывает</div></div><div><div class="big">${avg.toFixed(2)}</div><div class="lbl">средний числовой урон</div></div></div>
  <p class="lbl">Ожидаемый урон жетона вне Мордора с учётом «Ока»: ${n?((numeric.reduce((s,t)=>s+(+t.v),0)+c(t=>t.v==='Око')*expS/(pAny||1))/n).toFixed(2):'—'}</p>
  <div class="filters"><button class="btn" id="hRefill">Запас пуст: вернуть вытянутые обычные</button><button class="btn" id="hMordor">Вход в Мордор</button><button class="btn" id="hReset">Сбросить жетоны</button></div>
  <p class="note">«Вход в Мордор» возвращает вытянутые «Око» (кроме удалённых) и добавляет отложенные особые жетоны.</p></section></div>
 <h2 class="sec">Обычные жетоны</h2><div class="lg"><span>● в запасе</span><span>полупрозрачный — вытянут</span><span>зачёркнут — удалён навсегда</span><span>👁 — раскрывает</span></div>
 <div class="tokens">${HUNT_STD.map((t,i)=>`<button class="tok ${H.std[i]}" data-ht="${i}" title="${stdLab[H.std[i]]}">${t[0]==='Око'?'👁':t[0]}<small>${stdLab[H.std[i]]}</small>${t[1]&&t[0]!=='Око'?'<span class="r">👁</span>':''}</button>`).join('')}</div>
 <h2 class="sec">Особые жетоны</h2><p class="sub">Активируются картами; до входа в Мордор лежат отложенными.</p>
 <div class="tokens">${HUNT_SPECIAL.map(t=>`<button class="tok wide ${t.side} ${H.sp[t.k]}" data-hs="${t.k}" title="${t.label}: ${spLab[H.sp[t.k]]}">${t.v}<small>${t.label}</small><small>${spLab[H.sp[t.k]]}</small>${t.rev?'<span class="r">👁</span>':''}${t.stop?'<span class="s">⛔</span>':''}</button>`).join('')}</div>`;
 const setH=(k,v)=>{ hb[k]=Math.max(0,Math.min(k==='rr'?3:k==='fp'?6:10,v)); save(); renderHunt(); };
 document.querySelectorAll('[data-hd]').forEach(b=>b.onclick=()=>setH(b.dataset.hd,hb[b.dataset.hd]+(+b.dataset.d)));
 document.querySelectorAll('[data-hn]').forEach(i=>i.onchange=()=>setH(i.dataset.hn,parseInt(i.value)||0));
 $('#rav').onchange=e=>{hb.ravens=e.target.checked;save();renderHunt();};
 const cyc=['pool','drawn','removed']; document.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.ht; H.std[i]=cyc[(cyc.indexOf(H.std[i])+1)%3]; save(); renderHunt(); });
 const cs=['off','aside','pool','drawn']; document.querySelectorAll('[data-hs]').forEach(b=>b.onclick=()=>{ const k=b.dataset.hs; H.sp[k]=cs[(cs.indexOf(H.sp[k])+1)%4]; save(); renderHunt(); });
 $('#hRefill').onclick=()=>{ H.std=H.std.map(s=>s==='drawn'?'pool':s); save(); renderHunt(); };
 $('#hMordor').onclick=()=>{ H.std=H.std.map((s,i)=>s==='drawn'&&HUNT_STD[i][0]==='Око'?'pool':s); for(const k in H.sp) if(H.sp[k]==='aside') H.sp[k]='pool'; if(G.mordor<0) G.mordor=0; save(); renderHunt(); };
 $('#hReset').onclick=()=>{ S.hunt={std:HUNT_STD.map(()=>'pool'),sp:Object.fromEntries(HUNT_SPECIAL.map(t=>[t.k,'off']))}; save(); renderHunt(); };
}

// ================= Кубики =================
const FACES={fp:[
 ['char','Персонаж',2,['Двигать Братство (+Охота, кубик в ячейку)','Спрятать Братство','Отделить спутников / двигать спутников','Двигать или атаковать войском с лидером/спутником','Сыграть героическую карту'],['fs-move','hide','separate','companions','army-move']],
 ['muster','Сбор',1,['Дипломатия: +1 по шкале политики','Найм (народ «в войне»)','Сыграть карту «сбор»'],['politics','muster']],
 ['muster+army','Войско / Сбор',1,['Любое действие «Войско» или «Сбор»','Войско: двигать до 2 войск или атаковать одним; карта «войско»'],['army-move','battle']],
 ['event','Событие',1,['Взять карту из любой своей колоды','Сыграть любую карту'],['events']],
 ['will','Воля Запада',1,['Превратить в любую другую грань','Ввести Гэндальфа Белого или Арагорна','Сбросить «Палантир Ортханка» / «Безумие Денетора»'],['gandalf-white','strider']]],
 sh:[
 ['char','Персонаж',1,['Двигать назгулов (куда угодно) и прислужников','Двигать или атаковать войском с лидером/назгулом','Сыграть героическую карту'],['nazgul','minions','army-move']],
 ['army','Войско',1,['Двигать до 2 войск или атаковать одним','Сыграть карту «войско»'],['army-move','battle']],
 ['muster','Сбор',1,['Дипломатия','Найм (народ «в войне»)','Ввести прислужника','Сыграть карту «сбор»'],['muster','minions']],
 ['muster+army','Войско / Сбор',1,['Любое действие «Войско» или «Сбор»'],['army-move','muster']],
 ['event','Событие',1,['Взять карту из любой своей колоды','Сыграть любую карту'],['events']],
 ['eye','Око',1,['Сразу в ячейку Охоты: +1 кубик Охоты','Не действие'],['hunt-box']]]};
function renderDice(){
 const D=S.diceCalc||(S.diceCalc={fp:S.game.diceFp||4,sh:S.game.diceSh||7});
 const block=side=>{ const n=D[side]; return `<h2 class="sec" style="color:var(--${side})">${SIDE[side]}: ${n} куб.</h2>
  <div class="filters"><span class="num"><button data-dd="${side}" data-d="-1">−</button><input data-dn="${side}" value="${n}" inputmode="numeric" aria-label="Число кубиков"><button data-dd="${side}" data-d="1">+</button></span><span class="note">Грань на кубике × вероятность за бросок ${n} кубиков</span></div>
  <div class="faces">${FACES[side].map(([g,nm,cnt,acts,links])=>{ const p=cnt/6; const exp=n*p; const atl=1-Math.pow(1-p,n);
   return `<div class="face ${side}"><div class="g">${die(side,g)}</div><h3>${nm} <span class="note">${cnt}/6</span></h3><div class="lbl">В среднем ${exp.toFixed(2)} шт. · хотя бы одна — ${pct(atl)}</div><ul>${acts.map(a=>`<li>${a}</li>`).join('')}</ul><div class="chips">${links.map(l=>`<a class="chip" href="#r/${l}">${ENT[l].t}</a>`).join('')}</div></div>`; }).join('')}</div>`; };
 $('#main').innerHTML=`<h1 class="sec" style="margin-top:0">Грани кубиков действий</h1><p class="sub">${linkify('Подробнее: [[dice]], [[elven|Эльфийские кольца]], [[pass|пас]].')} Эльфийское кольцо меняет грань одного неиспользованного кубика (СН не может сделать «Волю Запада»).</p>${block('fp')}${block('sh')}`;
 const setD=(s,v)=>{ D[s]=Math.max(1,Math.min(10,v)); save(); renderDice(); };
 document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>setD(b.dataset.dd,D[b.dataset.dd]+(+b.dataset.d)));
 document.querySelectorAll('[data-dn]').forEach(i=>i.onchange=()=>setD(i.dataset.dn,parseInt(i.value)||1));
}

route();

</script>
</body>
